<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Infosphere</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1626">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script src="/static/js/theme-init.js?v={{ asset_v }}"></script>
<link rel="icon" type="image/png" href="/static/brand/favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Geist:wght@400..800&family=Geist+Mono:wght@500..700&display=swap">
<link rel="stylesheet" href="/static/css/sphere.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/site.css?v={{ asset_v }}">
<script src="/static/js/sphere.js?v={{ asset_v }}" defer></script>
</head>
<body class="site">
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="deck on-band">
  <a class="brand" href="/landing" aria-label="Infosphere home">
    <img src="/static/brand/logo-icon.png" alt="" width="29" height="34">
    <span class="brand-word">info<b>sphere</b></span>
  </a>
  <div class="deck-actions">
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="tt-mask"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="tt-shade" cx="12" cy="12" r="8" fill="#000"/></mask></defs>
        <circle class="tt-disc" cx="12" cy="12" r="5" fill="currentColor" mask="url(#tt-mask)"/>
        <g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g>
      </svg>
    </button>
    <a class="btn btn-quiet" href="/">Ask the AI</a>
  </div>
</header>

<main id="main">
  <div class="wrap nf">
    <span class="flap" id="nf-flap">404</span>
    <h1 class="display">This page took a <em>wrong turn</em>.</h1>
    <p class="lede">The room, link or page you were looking for isn't here, but the rest of Infosphere is.</p>
    <form class="nf-search" id="nf-form" autocomplete="off">
      <label class="sr-only" for="nf-input">Where did you want to go?</label>
      <input id="nf-input" placeholder="Try: kiosk, about, FAQ, feedback">
      <button type="submit" class="btn btn-amber" style="min-height:52px">Go</button>
    </form>
    <p class="nf-hint" id="nf-hint" role="status" aria-live="polite"></p>
    <div class="nf-links">
      <a class="btn btn-amber" href="/">Ask the guide</a>
      <a class="btn btn-quiet" href="/landing">Web portal</a>
      <a class="btn btn-quiet" href="/about">About</a>
    </div>
  </div>
</main>

{% include '_ticker.html' %}

<button type="button" class="fb-tab" data-feedback-open>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1 6.3 20.2l1.2-6.3L2.8 9.5l6.4-.8z"/></svg>
  <span>Rate us</span>
</button>

<script nonce="{{ csp_nonce() }}">
'use strict';
window.addEventListener('DOMContentLoaded', () => {
  const flap = new Sphere.Flap(document.getElementById('nf-flap'), { text: '   ', length: 3 });
  setTimeout(() => flap.set('404'), 150);

  /* a tiny known-pages index: matches by keyword and jumps straight there */
  const routes = [
    { keys: ['kiosk', 'map', 'route', 'chat', 'ask', 'ai', 'guide', 'room', 'ruang'], url: '/', label: 'the kiosk guide' },
    { keys: ['portal', 'campus', 'landing', 'home', 'binus', 'product'], url: '/landing', label: 'the web portal' },
    { keys: ['about', 'who', 'team', 'story'], url: '/about', label: 'About' },
    { keys: ['faq', 'question', 'help'], url: '/landing#faq', label: 'the FAQ' },
    { keys: ['feedback', 'bug', 'report', 'masukan'], url: '/feedback', label: 'feedback' },
  ];
  const hint = document.getElementById('nf-hint');
  document.getElementById('nf-form').addEventListener('submit', e => {
    e.preventDefault();
    const q = document.getElementById('nf-input').value.trim().toLowerCase();
    if (!q) return;
    const m = routes.find(r => r.keys.some(k => q.includes(k)));
    if (m) { hint.textContent = `Taking you to ${m.label}…`; setTimeout(() => { location.href = m.url; }, 400); }
    else hint.textContent = "No page matches that. Try the kiosk guide: it can find rooms and answer questions.";
  });
});
</script>
</body>
</html>
