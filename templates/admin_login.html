<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow">
<title>Infosphere · Admin Sign In</title>
<link rel="icon" type="image/png" href="/static/brand/favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/theme-tokens.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<div class="bg"></div>
<div class="shell">

<header>
  <a href="/" class="logo-wrap">
    <div class="logo-icon"><img src="/static/brand/logo-icon.png" alt="" aria-hidden="true"></div>
    <span class="logo-text">info<span>sphere</span></span>
  </a>
  <span class="header-title">ADMIN</span>
  <span></span>
</header>

<main class="login-wrap">
  <form class="login-card" method="post" action="/admin/login" autocomplete="on">
    <h1>Admin sign in</h1>
    <p class="sub">Visits, feedback and chatbot analytics.</p>

    {% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}
    {% if not configured %}
      <div class="login-error" role="alert">
        No admin password is set yet. On the server, run <code>python scripts/set_admin_password.py</code>.
      </div>
    {% endif %}

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url }}">

    <div class="login-field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required
             maxlength="100" value="{{ username }}" {% if not username %}autofocus{% endif %}>
    </div>
    <div class="login-field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required
             maxlength="200" {% if username %}autofocus{% endif %}>
    </div>
    <button class="btn-action" type="submit">Sign in</button>
  </form>
</main>

<footer>Infosphere Admin · copyright 2025 @infosphere</footer>
</div>
</body>
</html>
