<script nonce="{{ csp_nonce() }}">
/* Opened by double-clicking the .html file? Its styles, images and links are
   served by the Infosphere server, so explain how to start it instead of
   showing a broken page. (Browsers block file:// pages from probing localhost,
   so we can't auto-detect a running server.) */
(function () {
  if (location.protocol !== 'file:') return;
  var url = 'http://127.0.0.1:5000/';
  function help() {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:#0e1626;color:#fff;font:16px/1.6 system-ui,sans-serif;text-align:center';
    box.innerHTML = '<div style="max-width:520px"><h1 style="font-size:1.5rem;margin:0 0 12px">Start Infosphere first</h1>'
      + '<p style="margin:0 0 8px">Do not open the .html files directly. Double-click <b>Start Infosphere.bat</b> in the project folder and wait for the browser to open.</p>'
      + '<p style="margin:0 0 20px;opacity:.75">Jangan buka file .html langsung. Klik dua kali <b>Start Infosphere.bat</b>, lalu tunggu browser terbuka.</p>'
      + '<a href="' + url + '" style="display:inline-block;padding:10px 20px;border-radius:8px;background:#1a6bc6;color:#fff;font-weight:700;text-decoration:none">Already started? Open Infosphere</a></div>';
    document.body.appendChild(box);
  }
  if (document.body) help(); else document.addEventListener('DOMContentLoaded', help);
})();
</script>

<body class="kiosk">
<a class="skip-link" href="#search-input" data-i18n="skip">Lewati ke pencarian</a>
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="shell">

  <header class="deck on-band">
    <a class="brand" href="/" aria-label="Infosphere">
      <img src="/static/brand/logo-icon.png" alt="" width="29" height="34">
      <span class="brand-word">info<b>sphere</b></span>
    </a>

    <div class="deck-mid">
      <time class="deck-time" data-clock data-plain aria-live="off"></time>
      <div class="deck-meta hide-sm">
        <span class="deck-date" data-date></span>
        <span class="deck-wx" data-weather hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span data-weather-text></span>
        </span>
      </div>
    </div>

    <div class="deck-actions">
      <div class="seg show-sm" role="group" aria-label="Bahasa / Language / 语言" data-lang-seg>
        <button type="button" data-action="setLang" data-lang="IND" aria-pressed="true" aria-label="Bahasa Indonesia">ID</button>
        <button type="button" data-action="setLang" data-lang="ENG" aria-pressed="false" aria-label="English">EN</button>
        <button type="button" data-action="setLang" data-lang="ZH" aria-pressed="false" aria-label="中文">中</button>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Ganti tema">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs><mask id="tt-mask"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="tt-shade" cx="12" cy="12" r="8" fill="#000"/></mask></defs>
          <circle class="tt-disc" cx="12" cy="12" r="5" fill="currentColor" mask="url(#tt-mask)"/>
          <g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g>
        </svg>
      </button>
      <a class="btn btn-quiet hide-sm" href="/landing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span data-i18n="portal">Portal web</span>
      </a>
      <button type="button" class="btn btn-amber fb-cta" data-feedback-open data-magnetic="4">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg>
        <span class="hide-sm" data-i18n="feedback">Masukan</span>
        <span class="sr-only show-sm" data-i18n="feedback">Masukan</span>
      </button>
    </div>
  </header>

  <main class="stage" id="main">

    <!-- ── Guide: name and controls on top, the character standing at the
         bottom of the panel, the microphone in a bar at her feet ──────── -->
    <aside class="col-guide panel" aria-labelledby="guide-name">
      <div class="guide-head">
        <div class="guide-id">
          <h2 class="guide-name" id="guide-name" data-i18n="guideName">Kaela</h2>
          <p class="guide-state" id="guide-state" data-mode="idle" aria-live="polite">
            <span class="pulse" aria-hidden="true"></span><span id="guide-state-text">Aktif &amp; siap mendengarkan</span>
          </p>
        </div>
        <button type="button" class="switch" id="voice-switch" role="switch" aria-checked="true" data-action="toggleQuiet">
          <span class="switch-track"><span class="switch-thumb">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="sw-wave" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="sw-x" d="M16 9l5 6M21 9l-5 6"/></svg>
          </span></span>
          <span class="sr-only" data-i18n="voice">Suara</span>
        </button>
      </div>

      <div class="seg guide-seg" role="group" aria-label="Bahasa / Language / 语言" data-lang-seg>
        <button type="button" data-action="setLang" data-lang="IND" aria-pressed="true" aria-label="Bahasa Indonesia">ID</button>
        <button type="button" data-action="setLang" data-lang="ENG" aria-pressed="false" aria-label="English">EN</button>
        <button type="button" data-action="setLang" data-lang="ZH" aria-pressed="false" aria-label="中文">中文</button>
      </div>

      <div class="guide-fig" id="char-wrap" data-action="wave" role="img" aria-label="Infosphere">
        <canvas class="char-img active" id="img-idle"     data-src="/static/img/character/idle.jpeg"></canvas>
        <canvas class="char-img"        id="img-speak"    data-src="/static/img/character/speak.jpeg"></canvas>
        <canvas class="char-img"        id="img-thinking" data-src="/static/img/character/thinking.jpeg"></canvas>
        <canvas class="char-img"        id="img-waving"   data-src="/static/img/character/waving.jpeg"></canvas>
        <canvas class="char-img"        id="img-default"  data-src="/static/img/character/default.jpeg"></canvas>
      </div>

      <div class="guide-dock">
        <button type="button" class="mic-btn" id="mic-btn" data-mic aria-label="Tahan untuk bicara" data-i18n-aria="micHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3M8 22h8"/></svg>
        </button>
        <div class="dock-text">
          <p class="mic-hint" data-i18n="micHint">Tahan untuk bicara</p>
          <div class="wave" id="wave" data-mode="idle" aria-hidden="true"></div>
        </div>
      </div>
    </aside>

    <!-- ── Route: destination, map + directions, and the search at the bottom ── -->
    <section class="col-route" aria-label="Rute" data-i18n-aria="routeRegion">
      <div class="dest panel" id="dest" hidden aria-live="polite">
        <div class="dest-main">
          <h1 class="dest-name" id="dest-name"></h1>
          <p class="dest-sub" id="dest-sub"></p>
        </div>
        <dl class="dest-stats" id="dest-stats"></dl>
      </div>

      <div class="route-body" id="route-body">
        <div class="map-card panel" id="map-card">
          <div class="closure-banner" id="closure-banner" role="alert" hidden></div>
          <div id="map-container" class="map-container"></div>
        </div>

        <section class="steps panel" id="steps" aria-labelledby="steps-title" hidden>
          <div class="steps-head">
            <h2 id="steps-title" data-i18n="stepsTitle">Petunjuk arah</h2>
            <div class="steps-actions" id="steps-actions"></div>
          </div>
          <ol class="step-list" id="step-list"></ol>
        </section>
      </div>

      <div class="finder panel lit">
        <div class="search">
          <div class="search-field">
            <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <label class="sr-only" for="search-input" data-i18n="searchLabel">Cari ruangan atau tanya Infosphere</label>
            <input class="search-input" id="search-input" data-osk placeholder="Cari ruangan atau tanya…" data-i18n-ph="searchPh"
                   autocomplete="off" maxlength="500" role="combobox" aria-autocomplete="list"
                   aria-expanded="false" aria-controls="search-results">
            <ul class="search-results" id="search-results" role="listbox" aria-label="Hasil pencarian ruangan" hidden></ul>
          </div>
          <button type="button" class="btn btn-amber" data-action="submitSearch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            <span class="btn-label" data-i18n="findRoute">Cari rute</span>
          </button>
          <button type="button" class="btn btn-quiet btn-reset" data-action="resetAll" aria-label="Mulai ulang" data-i18n-aria="reset" title="Mulai ulang">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ── Chat ──────────────────────────────────────────────────────── -->
    <aside class="col-chat panel" id="chat" aria-labelledby="chat-title">
      <div class="chat-head">
        <h2 id="chat-title"><span class="dot" aria-hidden="true"></span><span data-i18n="chatTitle">Tanya Infosphere</span></h2>
        <button type="button" class="btn btn-quiet btn-icon sheet-close" data-action="closeSheet" aria-label="Tutup" data-i18n-aria="close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions"></div>

      <form class="composer" id="composer" autocomplete="off">
        <label class="sr-only" for="chat-input" data-i18n="chatPh">Tulis pertanyaan…</label>
        <input id="chat-input" data-osk maxlength="500" placeholder="Tulis pertanyaan…" data-i18n-ph="chatPh">
        <button type="button" class="btn btn-quiet btn-icon mic-mini" data-mic aria-label="Tahan untuk bicara" data-i18n-aria="micHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
        </button>
        <button type="submit" class="btn btn-cobalt btn-icon" aria-label="Kirim" data-i18n-aria="send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <p class="rs-line" id="rs-body" aria-live="polite"></p>
    </aside>
  </main>

  <footer class="ticker" aria-label="Info kiosk">
    <div class="ticker-view"><div class="ticker-track" id="ticker-track"></div></div>
    <nav class="ticker-links" aria-label="Halaman">
      <a href="/landing" data-i18n="portal">Portal web</a>
      <a href="/about" data-i18n="about">Tentang</a>
      <a href="/privacy" data-i18n="privacy">Privasi</a>
    </nav>
  </footer>
</div>

<button type="button" class="chat-fab" id="chat-fab" data-action="openSheet" aria-label="Buka chat dengan asisten" data-i18n-aria="openChat" data-mode="idle">
  <canvas id="fab-face" width="160" height="160" aria-hidden="true"></canvas>
  <span class="fab-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></span>
</button>
<div class="sheet-scrim" data-action="closeSheet" aria-hidden="true"></div>

<button type="button" class="fb-tab" data-feedback-open>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1 6.3 20.2l1.2-6.3L2.8 9.5l6.4-.8z"/></svg>
  <span data-i18n="rateUs">Beri nilai</span>
</button>

<dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-dialog-title">
  <h2 id="qr-dialog-title" data-i18n="qrTitle">Bawa rute di HP</h2>
  <img id="qr-img" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="240" height="240">
  <p id="qr-caption" data-i18n="qrCaption">Pindai dengan kamera HP. Petunjuk arah terbuka sebagai teks.</p>
  <button type="button" class="btn btn-amber" data-action="hideRouteQR" data-i18n="close">Tutup</button>
</dialog>

const imgMap = {
  idle: $('img-idle'), speak: $('img-speak'), thinking: $('img-thinking'),

};
const BG_THRESHOLD = 40;
function removeBlackBg(canvas, src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 800 / img.naturalWidth);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (r < BG_THRESHOLD && g < BG_THRESHOLD && b < BG_THRESHOLD) data[i + 3] = 0;
        else {
          const br = Math.max(r, g, b);
          if (br < BG_THRESHOLD * 2) data[i + 3] = Math.round(255 * (br - BG_THRESHOLD) / BG_THRESHOLD);
        }
      }
      ctx.putImageData(imageData, 0, 0);
      resolve();
    };
    img.onerror = () => { console.warn('Model image not found:', src); resolve(); };
    img.src = src;
  });
}
async function loadAllModels() {
  await Promise.all(Object.values(imgMap).map(c => removeBlackBg(c, c.dataset.src)));

}

/** Routing still shows the way, but warn when the destination or the path
    touches a closed / under-construction area. */
function updateClosureBanner(dest, legs) {
  const banner = $('closure-banner');
  const lines = [];
  const T = rt();
  for (const c of CLOSURES) {
    const poly = floorMap ? floorMap.closurePoly(c) : null;
    if (!poly) continue;
    const room = c.roomId && roomById(c.roomId);
    const isDest = dest && c.roomId === dest.id;
    const leg = legs && legs[c.floor];
    const onPath = leg && Routing.pathTouchesPoly(leg.points, poly);
    if (!isDest && !onPath) continue;
    let line = room ? T.warnRoom(roomName(room), statusLabel(c)) : T.warnPath(floorName(c.floor));
    if (c.note) line += ' ' + c.note;
    lines.push(line);
  }
  banner.textContent = '';
  lines.forEach(l => { const p = document.createElement('p'); p.textContent = l; banner.appendChild(p); });
  banner.hidden = !lines.length;
}

}

async function routeTo(dest, { viewFloor, quiet = false } = {}) {
  if (!MAP_DATA || !dest) return;
  initMap();
  const T = rt();
  const kRoom = KIOSK && roomById(KIOSK.room);
  floorMap.highlightRoom(dest.poly ? dest : null);
  const legs = {};
  let steps = [], metres = 0;

  if (!kRoom || !kRoom.poly) {
    floorMap.showFloor(dest.floor);
    floorMap.setRoute({});
    setRouteMessage(dest, dest.poly ? roomPlace(dest) : T.noMap(roomName(dest), floorName(dest.floor)));
  } else if (dest.id === kRoom.id) {
    floorMap.showFloor(dest.floor);
    floorMap.setRoute({});
    setRouteMessage(dest, T.here(roomName(dest)));
  } else {
    const kFloor = floorDef(kRoom.floor);
    const start = Routing.roomCentre(kRoom);
    const destLabel = roomName(dest);
    const viaRoom = dest.access && roomById(dest.access.via_room);
    if (viaRoom && viaRoom.poly && viaRoom.floor === kRoom.floor) {
      // Reached only through another room (R Baca, the Floor 2 library: through the LKC). Walk there, then its step.
      const p1 = await Routing.route(kFloor, ROOMS, start, Routing.roomCentre(viaRoom), [kRoom.id, viaRoom.id]);
      let pts = p1;
      if (dest.floor === kFloor.floor && dest.poly) {
        const p2 = await Routing.route(kFloor, ROOMS, Routing.roomCentre(viaRoom), Routing.roomCentre(dest), [viaRoom.id, dest.id]);
        pts = p1.concat(p2.slice(1));
      }
      const sameFloor = dest.floor === kFloor.floor;
      legs[kFloor.floor] = { points: pts, start: { kind: 'you', label: MAP_TEXT[currentLang].you },
        end: sameFloor ? { kind: 'end', label: destLabel } : { kind: 'connector', label: roomName(viaRoom) } };
      steps = Routing.steps(p1, ROOMS, kFloor, roomName(viaRoom), T);
      steps.pop();                       // not "the LKC is in front of you": the LKC is the way in, not the goal
      steps.push(accessStep(dest));
      if (!sameFloor) steps.push(roomPlace(dest) ? `${destLabel}: ${roomPlace(dest)}` : T.noMap(destLabel, floorName(dest.floor)));
      metres = Routing.metres(pts, kFloor);
    } else if (dest.floor === kRoom.floor && dest.poly) {
      const pts = await Routing.route(kFloor, ROOMS, start, Routing.roomCentre(dest), [kRoom.id, dest.id]);
      legs[kFloor.floor] = { points: pts, start: { kind: 'you', label: MAP_TEXT[currentLang].you }, end: { kind: 'end', label: destLabel } };
      steps = Routing.steps(pts, ROOMS, kFloor, destLabel, T);
      metres = Routing.metres(pts, kFloor);
    } else {
      const dFloor = floorDef(dest.floor);
      const via = kFloor.connector;
      // A floor (or one building on it) reached only by the stairs: connector to the nearest allowed floor,
      // then the stairs. (The stairs have no map position yet, so that floor gets no route line.)
      const access = roomAccess(dest) && roomAccess(dest).via_floors ? roomAccess(dest) : null;
      const viaFloor = access
        ? access.via_floors.reduce((a, b) => (Math.abs(b - kRoom.floor) < Math.abs(a - kRoom.floor) ? b : a))
        : dest.floor;
      const p1 = await Routing.route(kFloor, ROOMS, start, via.xy, [kRoom.id]);
      legs[kFloor.floor] = { points: p1, start: { kind: 'you', label: MAP_TEXT[currentLang].you }, end: { kind: 'connector', label: viaName(via.name) } };
      steps = Routing.steps(p1, ROOMS, kFloor, viaName(via.name), T);
      steps.pop();
      steps.push(T.takeTo(viaName(via.name), floorName(viaFloor)));
      metres = Routing.metres(p1, kFloor);
      if (access) {
        steps.push(T.stairsTo(floorName(viaFloor), floorName(dest.floor)));
        steps.push(roomPlace(dest) ? `${destLabel}: ${roomPlace(dest)}` : T.noMap(destLabel, floorName(dest.floor)));
      } else if (dFloor && dest.poly) {
        const p2 = await Routing.route(dFloor, ROOMS, dFloor.connector.xy, Routing.roomCentre(dest), [dest.id]);
        legs[dFloor.floor] = { points: p2, start: { kind: 'connector', label: viaName(dFloor.connector.name) }, end: { kind: 'end', label: destLabel } };
        steps.push(T.exit(viaName(dFloor.connector.name), floorName(dest.floor)));
        steps.push(...Routing.steps(p2, ROOMS, dFloor, destLabel, T));
        metres += Routing.metres(p2, dFloor);
      } else {
        steps.push(roomPlace(dest) ? `${destLabel}: ${roomPlace(dest)}` : T.noMap(destLabel, floorName(dest.floor)));
      }
    }

    floorMap.setRoute(legs, { animate: !quiet });
    showDirections(dest, metres, steps, legs, quiet);
  }

}

/* ── Room search (type-ahead) ─────────────────────────────────────────── */
let searchHits = [];
let searchIndex = -1;
const normalise = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '');
const HAS_CJK = /[㐀-鿿]/;
const searchable = q => normalise(q).length >= 2 || HAS_CJK.test(q);

function findRooms(q) {
  if (HAS_CJK.test(q)) {                       // Mandarin: match the Chinese room names
    const t = q.replace(/[\s？?在哪里儿怎么去的位置]/g, '');
    return ROOMS.filter(r => r.name_zh && t && (r.name_zh.includes(t) || t.includes(r.name_zh.split('（')[0])))
                .sort((a, b) => a.floor - b.floor).slice(0, 8);
  }
  const nq = normalise(q);
  if (nq.length < 2) return [];
  const scored = [];
  for (const r of ROOMS) {
    const keys = [r.name, r.id, r.name_en, ...(r.aliases || [])].filter(Boolean).map(normalise);
    let score = 0;
    for (const k of keys) {
      if (k === nq) score = Math.max(score, 3);
      else if (k.startsWith(nq)) score = Math.max(score, 2);
      else if (k.includes(nq)) score = Math.max(score, 1);
    }
    if (score) scored.push([score, r]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].floor - b[1].floor || a[1].name.localeCompare(b[1].name))
               .slice(0, 8).map(x => x[1]);
}

function renderSearchResults() {
  searchHits = findRooms(searchInput.value);
  searchResults.textContent = '';
  searchResults.setAttribute('aria-label', rt().results);
  if (!searchInput.value.trim() || !searchable(searchInput.value)) { closeSearchResults(); return; }
  if (!searchHits.length) {
    const li = document.createElement('li');
    li.className = 'sr-empty';
    li.textContent = rt().noResults;
    searchResults.appendChild(li);
  }
  searchHits.forEach((room, i) => {
    const li = document.createElement('li');
    li.id = 'sr-' + i;
    li.setAttribute('role', 'option');
    li.className = 'sr-item' + (i === searchIndex ? ' active' : '');
    li.setAttribute('aria-selected', i === searchIndex ? 'true' : 'false');
    li.dataset.action = 'pickRoom';
    li.dataset.id = room.id;
    const name = document.createElement('span');
    name.className = 'sr-name';
    name.textContent = roomName(room);
    const floor = document.createElement('span');
    floor.className = 'sr-floor';
    floor.textContent = floorName(room.floor);
    li.append(name, floor);
    const c = closureFor(room);
    if (c) {
      const badge = document.createElement('span');
      badge.className = 'status-badge status-' + c.status;
      badge.textContent = statusLabel(c);
      if (c.note) badge.title = c.note;
      li.appendChild(badge);
    }
    searchResults.appendChild(li);
  });
  searchResults.hidden = false;
  searchInput.setAttribute('aria-expanded', 'true');
  if (searchIndex >= 0) searchInput.setAttribute('aria-activedescendant', 'sr-' + searchIndex);
  else searchInput.removeAttribute('aria-activedescendant');
}

function closeSearchResults() {
  searchResults.hidden = true;
  searchIndex = -1;
  searchInput.setAttribute('aria-expanded', 'false');
  searchInput.removeAttribute('aria-activedescendant');
}

function pickRoom(room) {
  if (!room) return;
  closeSearchResults();
  searchInput.value = '';
  showRoomCard(room);
  routeTo(room);
  speakRoom(room);
}

/** Say the room's answer (same words and voice as the assistant), unless Quiet is on. */
async function speakRoom(room) {
  if (quietMode || !room) return;
  try {
    const res = await fetch(`/api/room-answer/${encodeURIComponent(room.id)}?lang=${currentLang}`);
    if (!res.ok) return;
    const data = await res.json();
    await playResponse(data);       // human recording when the room has one, like a typed question
  } catch (e) {
    console.warn('[Voice] room answer failed:', e);
  }
}

function handleSearchKey(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!searchHits.length) return;
    e.preventDefault();
    const n = searchHits.length;
    searchIndex = e.key === 'ArrowDown' ? (searchIndex + 1) % n : (searchIndex - 1 + n) % n;
    renderSearchResults();
  } else if (e.key === 'Escape') {
    closeSearchResults();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchIndex >= 0 && searchHits[searchIndex]) pickRoom(searchHits[searchIndex]);
    else submitSearch();
  }
}

function submitSearch() {
  const q = searchInput.value.trim();
  if (!q) { searchInput.focus(); return; }
  closeSearchResults();
  searchInput.value = '';
  // a typed room name goes straight to the map; anything else asks the AI
  const hits = findRooms(q);
  if (hits.length && normalise(q) && hits.some(r => normalise(r.name) === normalise(q) || normalise(r.id) === normalise(q))) {
    pickRoom(hits[0]);
    return;
  }
  ask(q);
}

/* ── Chat thread ─────────────────────────────────────────────────────── */
const MAX_MESSAGES = 40;
function pushMsg(el) {
  thread.appendChild(el);
  while (thread.children.length > MAX_MESSAGES) thread.firstElementChild.remove();
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
  return el;
}
function addUser(text) {
  const m = document.createElement('div');
  m.className = 'msg user';
  m.textContent = text;
  return pushMsg(m);
}
function botShell() {
  const m = document.createElement('div');
  m.className = 'msg bot';
  const who = document.createElement('div');
  who.className = 'msg-who';
  who.textContent = 'Kaela';
  m.appendChild(who);
  return m;
}
function addThinking() {
  const m = botShell();
  m.classList.add('is-thinking');
  m.insertAdjacentHTML('beforeend', '<div class="thinking" aria-hidden="true"><span></span><span></span><span></span></div>');
  return pushMsg(m);
}
/** Plain text only (never HTML). opts: { conf, q, feedback, route } */
function addBot(text, opts = {}, replace = null) {
  const T = ui();
  const m = botShell();
  if (opts.q) m.dataset.q = opts.q;
  const t = document.createElement('div');
  t.className = 'msg-text';
  t.textContent = text;
  m.appendChild(t);
  if (opts.feedback || opts.route) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    if (opts.feedback && opts.conf != null) {
      const c = document.createElement('span');
      c.className = 'conf';
      c.textContent = `${T.conf} ${opts.conf}%`;
      meta.appendChild(c);
    }
    if (opts.route && isNarrow()) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn btn-amber'; b.dataset.action = 'viewMap';
      b.textContent = T.viewMap;
      meta.appendChild(b);
    }
    if (opts.feedback) {
      const th = document.createElement('span');
      th.className = 'thumbs';
      th.innerHTML = `<button type="button" class="thumb" data-action="feedbackYes"></button><button type="button" class="thumb" data-action="feedbackNo"></button>`;
      th.children[0].textContent = T.yes;
      th.children[1].textContent = T.no;
      meta.appendChild(th);
    }
    m.appendChild(meta);
  }
  if (replace && replace.parentNode) { replace.replaceWith(m); requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; }); return m; }
  return pushMsg(m);
}

function ask(q) {

                                 : `Question is too long (max ${CHAT_MAX_CHARS} characters).`);

/* ── Voice input: browser speech recognition, Whisper on the server as fallback ── */
const _SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let useBrowserSTT = !!_SpeechAPI;
const _browserLang = () => ({ IND: 'id-ID', ENG: 'en-US', ZH: 'zh-CN' })[currentLang] || 'id-ID';
const setRecording = on => { recording = on; micButtons.forEach(b => b.classList.toggle('recording', on)); };

if (_SpeechAPI) {
  recognition = new _SpeechAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.lang = _browserLang();
  recognition.onresult = evt => {
    const transcript = (evt.results[0][0].transcript || '').trim();
    setRecording(false);
    if (!transcript) { setStatus('ready'); setCharState('idle'); return; }
    addUser(transcript);
    askBot(transcript);
  };
  recognition.onerror = evt => {
    console.warn('[STT browser]', evt.error);
    setRecording(false);
    if (evt.error === 'not-allowed' || evt.error === 'service-not-allowed') useBrowserSTT = false;
    setStatus(evt.error === 'no-speech' ? 'notUnderstood' : 'ready'); setCharState('idle');
  };
  recognition.onend = () => {
    if (recording) { setRecording(false); setStatus('ready'); setCharState('idle'); }
  };
}

async function startRecording() {
  if (recording) return;
  stopAudio();
  playAudioUrl('/audio/ready').catch(() => {});
  if (useBrowserSTT && recognition) {
    try {
      recognition.lang = _browserLang();
      recognition.start();
      setRecording(true);
      setStatus('listening');
      setCharState('waving');
      return;
    } catch (e) {
      console.warn('[STT] browser start failed, switching to Whisper:', e);
      useBrowserSTT = false;
    }
  }
  _startWhisper();
}

async function stopRecording() {
  if (!recording) return;
  if (useBrowserSTT && recognition) {
    recognition.stop();
    setStatus('processing');
    setCharState('thinking');
  } else {
    _stopWhisper();
  }
}

async function _startWhisper() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    setRecording(true);
    setStatus('listening');
    setCharState('waving');
  } catch (err) {
    console.error('Mic error:', err);
    setStatus('micDenied');
  }
}

async function _stopWhisper() {
  if (!mediaRecorder) return;
  setRecording(false);
  setStatus('processing');
  setCharState('thinking');
  mediaRecorder.stop();
  await new Promise(res => mediaRecorder.addEventListener('stop', res, { once: true }));
  stream.getTracks().forEach(t => t.stop());

  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const fd = new FormData();
  fd.append('audio', blob, 'rec.webm');
  fd.append('lang', currentLang);
  try {
    const res = await fetch('/transcribe', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error || !data.transcript) { setStatus('notUnderstood'); setCharState('idle'); return; }
    if (data.detected_lang) {
      const nl = { id: 'IND', en: 'ENG', zh: 'ZH' }[data.detected_lang];
      if (nl && nl !== currentLang) {
        const b = document.querySelector(`[data-lang-seg] [data-lang="${nl}"]`);
        if (b) setLang(b);
      }
    }
    addUser(data.transcript);
    await askBot(data.transcript);
  } catch (err) {
    console.error(err);
    setStatus('network'); setCharState('idle');
  }
}

/* ── Asking the assistant ─────────────────────────────────────────────── */
const CHAT_ERRORS = {
  IND: { busy: 'Terlalu banyak pertanyaan. Tunggu sebentar lalu coba lagi.',
         timeout: 'Asisten terlalu lama menjawab. Silakan coba lagi.',
         network: 'Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.',
         generic: 'Maaf, asisten sedang tidak tersedia. Silakan coba lagi sebentar lagi.' },
  ENG: { busy: 'Too many questions. Please wait a moment and try again.',
         timeout: 'The assistant took too long to answer. Please try again.',
         network: "Can't reach the server. Check the connection and try again.",
         generic: 'Sorry, the assistant is unavailable right now. Please try again shortly.' },
  ZH:  { busy: '提问过于频繁，请稍后再试。', timeout: '助手响应超时，请重试。',
         network: '无法连接服务器，请检查网络后重试。', generic: '抱歉，助手暂时不可用，请稍后再试。' },
};
function friendlyChatError(status, data) {
  const E = CHAT_ERRORS[currentLang] || CHAT_ERRORS.IND;
  if (status === 429) return E.busy;
  if (status === 504) return E.timeout;
  if (status === 400 && data && data.message) return data.message;
  return E.generic;
}

async function askBot(question) {
  const pending = addThinking();
  setStatus('thinking');
  setCharState('thinking');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question.slice(0, CHAT_MAX_CHARS), lang: currentLang }),
      signal: ctrl.signal,
    });
    let data = {};
    try { data = await res.json(); } catch (_) { /* non-JSON error page */ }
    if (!res.ok || data.error) {
      addBot(friendlyChatError(res.status, data), {}, pending);
      setCharState('idle');
      return;
    }
    let routed = false;
    if (data.found !== false) {
      const room = data.room_id && roomById(data.room_id);
      if (room) { routeTo(room); routed = true; }
      else routed = autoOpenMapIfNeeded(data.answer, question);
    } else clearRoute();
    addBot(data.answer, { conf: data.confidence, q: question, feedback: true, route: routed }, pending);
    setStatus('ready');
    await playResponse(data);
  } catch (err) {
    console.error('[Chat] error:', err);
    const E = CHAT_ERRORS[currentLang] || CHAT_ERRORS.IND;
    addBot(err.name === 'AbortError' ? E.timeout : E.network, {}, pending);
    setCharState('idle');
  } finally {
    clearTimeout(timer);
    if (statusKey !== 'speaking') setStatus('ready');
  }
}

/* After a chatbot answer: if the question or answer names a room, route to it.
   The longest matching name/alias wins ("library lantai 2" beats "library"),
   whole words only, question first. */
function autoOpenMapIfNeeded(answer, question = '') {
  try {
    const findIn = text => {
      const hay = ' ' + String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ') + ' ';
      let best = null, bestLen = 0;
      for (const r of ROOMS) {
        for (const key of [r.id, r.name, ...(r.aliases || [])]) {
          const k = String(key).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
          if (k.length >= 3 && k.length > bestLen && hay.includes(' ' + k + ' ')) { best = r; bestLen = k.length; }
        }
      }
      return best;
    };
    const matched = findIn(question) || findIn(answer);
    if (matched) { routeTo(matched); return true; }
  } catch (e) { console.warn('[Map] route error:', e); }
  return false;
}

function showRouteQR() {

  if (d.showModal) d.showModal();

const hideRouteQR = () => $('qr-dialog').close();

/* ── Voice output ─────────────────────────────────────────────────────── */
async function playResponse(data) {
  if (quietMode) { setCharState('idle'); return; }
  setStatus('speaking');
  setCharState('speak');
  try {
    let url;
    if (data.has_audio_file && data.audio_id != null) {
      url = `/audio/${data.audio_id}`;
    } else {
      const r = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: data.answer, lang: LANG_TO_CODE[currentLang] || 'id' }),
      });
      if (!r.ok) throw new Error('TTS failed');
      url = URL.createObjectURL(await r.blob());
    }
    await playAudioUrl(url);
  } catch (err) {
    console.warn('Playback error:', err);
  } finally {
    if (statusKey === 'speaking') setStatus('ready');
    setCharState('idle');
  }
}

let currentAudio = null;
function playAudioUrl(url) {
  stopAudio();
  return new Promise(resolve => {
    const a = new Audio(url);
    currentAudio = a;
    const done = () => { if (currentAudio === a) currentAudio = null; resolve(); };
    a.onended = done;
    a.onerror = done;
    a.play().catch(done);
  });
}
function stopAudio() {
  if (currentAudio) { const a = currentAudio; currentAudio = null; a.pause(); a.onended && a.onended(); }
}

function toggleQuiet() {
  quietMode = !quietMode;
  $('voice-switch').setAttribute('aria-checked', quietMode ? 'false' : 'true');
  if (quietMode) { stopAudio(); setCharState('idle'); if (statusKey === 'speaking') setStatus('ready'); }
  renderTicker();
}

/* ── Thumbs feedback on an answer ─────────────────────────────────────── */
async function sendFeedback(positive, el) {
  const msg = el && el.closest('.msg');
  const th = el && el.closest('.thumbs');
  if (th) {
    const T = ui();
    th.textContent = '';
    const ok = document.createElement('span'); ok.className = 'fb-done'; ok.textContent = T.thanks;
    th.appendChild(ok);
    if (!positive) {
      const more = document.createElement('button');
      more.type = 'button'; more.className = 'thumb'; more.textContent = T.more2;
      more.addEventListener('click', () => document.querySelector('.fb-tab').click());
      th.appendChild(more);
    }
  }
  try {
    await fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ positive, question: (msg && msg.dataset.q) || '' }),
    });
  } catch (e) { /* offline: nothing to do */ }
}

/* ── Footer ticker ────────────────────────────────────────────────────── */
let netInfo = '';
function renderTicker() {
  const track = $('ticker-track');
  if (!track) return;
  const L = currentLang;
  const kRoom = KIOSK && roomById(KIOSK.room);
  const nFloors = MAP_DATA ? MAP_DATA.floors.length : 0;
  const closed = CLOSURES.length;
  const items = {
    IND: [
      kRoom && ['Kiosk ini', `${kRoom.name}, ${floorName(kRoom.floor)}`],
      MAP_DATA && ['Peta', `${ROOMS.length} ruangan di ${nFloors} lantai`],
      ['Area', closed ? `${closed} sedang ditutup atau direnovasi` : 'semua buka'],
      ['Suara', quietMode ? 'senyap' : 'aktif'],
      ['Bahasa', 'Bahasa Indonesia, English, 中文'],
      ['Tips', 'tahan tombol mikrofon lalu sebutkan tujuan Anda'],
      ['Tips', 'pindai QR untuk membawa rute di HP'],
      netInfo && ['Jaringan', netInfo],
    ],
    ENG: [
      kRoom && ['This kiosk', `${roomName(kRoom)}, ${floorName(kRoom.floor)}`],
      MAP_DATA && ['Map', `${ROOMS.length} rooms on ${nFloors} floors`],
      ['Areas', closed ? `${closed} closed or under construction` : 'all open'],
      ['Voice', quietMode ? 'muted' : 'on'],
      ['Languages', 'Bahasa Indonesia, English, 中文'],
      ['Tip', 'hold the mic button and say where you want to go'],
      ['Tip', 'scan the QR code to take the route on your phone'],
      netInfo && ['Network', netInfo],
    ],
    ZH: [
      kRoom && ['本服务台', `${roomName(kRoom)}，${floorName(kRoom.floor)}`],
      MAP_DATA && ['地图', `${nFloors} 层楼共 ${ROOMS.length} 个房间`],
      ['区域', closed ? `${closed} 处关闭或施工中` : '全部开放'],
      ['语音', quietMode ? '静音' : '开启'],
      ['语言', 'Bahasa Indonesia、English、中文'],
      ['提示', '按住麦克风按钮，说出您要去的地方'],
      ['提示', '扫描二维码，把路线带到手机上'],
      netInfo && ['网络', netInfo],
    ],
  }[L].filter(Boolean);
  const build = () => items.map(([k, v]) => {
    const s = document.createElement('span');
    s.className = 'ticker-item';
    const b = document.createElement('b'); b.textContent = k;
    s.append(b, ' ' + v);
    return s;
  });
  track.textContent = '';
  track.append(...build().slice(0, 3));
}

/* ── Mobile chat sheet ────────────────────────────────────────────────── */
let sheetReturn = null;
function openSheet() {
  sheetReturn = document.activeElement;
  document.body.classList.add('sheet-open');
  setTimeout(() => $('chat-input').focus({ preventScroll: true }), 300);
}
function closeSheet() {
  document.body.classList.remove('sheet-open');
  if (sheetReturn && sheetReturn.focus) sheetReturn.focus({ preventScroll: true });
}
function viewMap() {
  closeSheet();
  $('map-card').scrollIntoView({ behavior: Sphere.reduced() ? 'auto' : 'smooth', block: 'start' });
}

/* ── Event wiring ─────────────────────────────────────────────────────────
   Buttons carry data-action="…" instead of inline onclick= attributes, which
   the Content-Security-Policy blocks. One delegated listener handles them all,
   including buttons created later. */
const ACTIONS = {
  resetAll:      () => resetAll(),
  submitSearch:  () => submitSearch(),
  toggleQuiet:   () => toggleQuiet(),
  setLang:       el => setLang(el),
  wave:          () => setCharState('waving', 2000),
  showRouteQR:   () => showRouteQR(),
  hideRouteQR:   () => hideRouteQR(),
  showLeg:       el => showLeg(el),
  pickRoom:      el => pickRoom(roomById(el.dataset.id)),
  feedbackYes:   el => sendFeedback(true, el),
  feedbackNo:    el => sendFeedback(false, el),
  ask:           el => ask(el.dataset.q),
  locateMe:      () => floorMap && floorMap.locate(),
  toggleFullMap: () => toggleFullMap(),
  openSheet:     () => openSheet(),
  closeSheet:    () => closeSheet(),
  viewMap:       () => viewMap(),
};
document.addEventListener('click', e => {
  if (e.target.id === 'qr-dialog') { hideRouteQR(); return; }   // click on the backdrop
  if (!e.target.closest('.search-field')) closeSearchResults();
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('map-card').classList.contains('is-full')) toggleFullMap(false);
  else if (document.body.classList.contains('sheet-open')) closeSheet();
});
searchInput.addEventListener('keydown', handleSearchKey);
searchInput.addEventListener('input', () => { searchIndex = -1; renderSearchResults(); });
searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(); });
$('composer').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('chat-input');
  const q = inp.value.trim();
  if (!q) { inp.focus(); return; }
  inp.value = '';
  ask(q);
});
$('chat-input').addEventListener('keydown', e => {
  // the on-screen keyboard sends a synthetic Enter
  if (e.key === 'Enter' && !e.isTrusted) { e.preventDefault(); $('composer').requestSubmit(); }
});

/* hold-to-talk on every mic button: pointer, touch and keyboard (Space/Enter) */
micButtons.forEach(btn => {
  btn.addEventListener('pointerdown', e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} startRecording(); });
  btn.addEventListener('pointerup', () => stopRecording());
  btn.addEventListener('pointercancel', () => stopRecording());
  btn.addEventListener('contextmenu', e => e.preventDefault());
  btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startRecording(); } });
  btn.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); stopRecording(); } });
});

/* ── Boot ─────────────────────────────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  applyStaticText(false);
  setStatus('ready');
  renderWelcome();
  setQR(false);
  renderRoomStatus();
});
window.addEventListener('load', async () => {
  setCharState('waving', 2800);
  loadAllModels();
  await loadRooms();
  await loadClosures();          // before the map, so closures are drawn right away
  initMap();
  renderTicker();
  setInterval(loadClosures, 60000);
  // links from the web portal: /?room=<id> opens a route, /?q=<question> asks it
  const params = new URLSearchParams(location.search);
  const linked = params.get('room') && roomById(params.get('room'));
  if (linked) pickRoom(linked);
  else if (params.get('q')) ask(params.get('q').slice(0, CHAT_MAX_CHARS));
  if (params.has('room') || params.has('q')) {
    params.delete('room'); params.delete('q');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : ''));
  }
});
fetch('/status').then(r => r.json()).then(d => { if (d.ip) { netInfo = `${d.ip}:${d.port}`; renderTicker(); } }).catch(() => {});
</script>
