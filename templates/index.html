<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Infosphere · Voice Assistant</title>
<script nonce="{{ csp_nonce() }}">
/* Opened by double-clicking the .html file? Its styles, images and links are
   served by the Infosphere server, so explain how to start it instead of
   showing a broken page. (Browsers block file:// pages from probing localhost,
   so we can't auto-detect a running server.) */
(function () {
  if (location.protocol !== 'file:') return;
  var url = 'http://127.0.0.1:5000/';
  function help() {
    var box = document.createElement('div');
    box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:#0b1f3a;color:#fff;font:16px/1.6 system-ui,sans-serif;text-align:center';
    box.innerHTML = '<div style="max-width:520px"><h1 style="font-size:1.5rem;margin:0 0 12px">Start Infosphere first</h1>'
      + '<p style="margin:0 0 8px">Do not open the .html files directly. Double-click <b>Start Infosphere.bat</b> in the project folder and wait for the browser to open.</p>'
      + '<p style="margin:0 0 20px;opacity:.75">Jangan buka file .html langsung. Klik dua kali <b>Start Infosphere.bat</b>, lalu tunggu browser terbuka.</p>'
      + '<a href="' + url + '" style="display:inline-block;padding:10px 20px;border-radius:8px;background:#f7941d;color:#0b1f3a;font-weight:700;text-decoration:none">Already started? Open Infosphere</a></div>';
    document.body.appendChild(box);
  }
  if (document.body) help(); else document.addEventListener('DOMContentLoaded', help);
})();
</script>
<link rel="icon" type="image/png" href="/static/brand/favicon-256.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/map.css"/>
<script src="/static/js/panzoom.js" defer></script>
<script src="/static/js/routing.js" defer></script>
<script src="/static/js/floor-map.js" defer></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:       #1565c0;
  --blue-mid:   #1976d2;
  --blue-light: #2196f3;
  --blue-pale:  #e3f2fd;
  --cyan:       #00b4d8;
  --white:      #ffffff;
  --gray:       #90a4ae;
  --text-dark:  #1a2a3a;
  --text-mid:   #37474f;
  --shadow-sm:  0 1px 2px rgba(21,101,192,.06), 0 2px 8px rgba(21,101,192,.10);
  --shadow:     0 2px 6px rgba(21,101,192,.07), 0 8px 28px rgba(21,101,192,.14);
  --shadow-lg:  0 4px 12px rgba(21,101,192,.10), 0 18px 50px rgba(21,101,192,.20);
  --grad-blue:  linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  --glass:      rgba(255,255,255,.78);
  --glass-brd:  rgba(255,255,255,.65);
  --ring:       0 0 0 3px rgba(33,150,243,.14);
  --font:       'Nunito', sans-serif;
  --font-hud:   'Exo 2', sans-serif;
  --radius:     18px;
}

html, body { height: 100%; font-family: var(--font); background: #dce8f5; overflow: hidden; }

.bg {
  position: fixed; inset: 0; overflow: hidden;
  background:
    linear-gradient(160deg, #eaf4ff 0%, #dce8f8 55%, #cfe0f4 100%);
  z-index: 0;
}
.bg::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(33,150,243,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(33,150,243,.035) 1px, transparent 1px);
  background-size: 46px 46px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 85%);
          mask-image: radial-gradient(ellipse at center, #000 35%, transparent 85%);
}
.bg::after {
  content: ''; position: absolute; inset: -10%;
  background:
    radial-gradient(420px circle at 18% 78%, rgba(33,150,243,.16), transparent 60%),
    radial-gradient(380px circle at 84% 18%, rgba(0,180,216,.13), transparent 60%),
    radial-gradient(300px circle at 70% 85%, rgba(21,101,192,.10), transparent 60%);
  animation: orbDrift 22s ease-in-out infinite alternate;
}
@keyframes orbDrift {
  0%   { transform: translate3d(0,0,0) scale(1); }
  100% { transform: translate3d(-3%, 2%, 0) scale(1.08); }
}

.shell {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  height: 100vh;
}

header {
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid rgba(255,255,255,.6);
  padding: 11px 24px;
  flex-shrink: 0;
  box-shadow: 0 1px 0 rgba(33,150,243,.08), 0 6px 22px rgba(21,101,192,.08);
  z-index: 100;
  animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
}

@keyframes rise { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.toolbar        { animation: rise .5s .06s cubic-bezier(.2,.7,.3,1) both; }
.character-stage{ animation: fadeUp .6s .12s cubic-bezier(.2,.7,.3,1) both; }
.right-panel    { animation: fadeUp .6s .18s cubic-bezier(.2,.7,.3,1) both; }
.lang-sidebar   { animation: rise .5s .1s cubic-bezier(.2,.7,.3,1) both; }

.logo-wrap { display: flex; align-items: center; gap: 9px; }
.logo-icon {
  position: relative;
  width: 38px; height: 38px;
  background: radial-gradient(circle at 35% 30%, #4fb0ff, #1565c0);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-hud); font-weight: 800; font-size: .9rem;
  box-shadow: 0 4px 12px rgba(21,101,192,.4), inset 0 1px 2px rgba(255,255,255,.6);
}
.logo-icon::after {
  content: ''; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid rgba(33,150,243,.45);
  animation: logoPulse 2.6s ease-out infinite;
}
@keyframes logoPulse {
  0%   { transform: scale(1);   opacity: .6; }
  70%  { transform: scale(1.4); opacity: 0; }
  100% { opacity: 0; }
}
.logo-text { font-family: var(--font-hud); font-size: 1.18rem; font-weight: 800; color: var(--blue-mid); letter-spacing: .01em; }
.logo-text span { color: var(--blue-light); }

.header-center {
  display: flex; align-items: center; gap: 18px;
  font-family: var(--font-hud); font-size: .88rem; font-weight: 600; color: var(--text-mid);
}
.header-center .div { color: var(--gray); }

.btn-login {
  background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  color: #fff; border: none; padding: 8px 20px; border-radius: 22px;
  font-family: var(--font); font-size: .82rem; font-weight: 700;
  cursor: pointer; box-shadow: var(--shadow-sm); transition: all .2s; letter-spacing: .03em;
}
.btn-login:hover { transform: translateY(-1px); box-shadow: var(--shadow); }

.toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 20px;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(33,150,243,.1);
  flex-shrink: 0; z-index: 99;
}

.btn-refresh {
  width: 36px; height: 36px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #43e97b, #38f9d7);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 2px 8px rgba(67,233,123,.3);
  transition: all .3s; flex-shrink: 0;
}
.btn-refresh:hover { transform: rotate(180deg) scale(1.05); }

.search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
.search-input {
  width: 100%; background: var(--white);
  border: 1.5px solid rgba(33,150,243,.3); border-radius: 24px;
  padding: 8px 40px 8px 18px;
  font-family: var(--font); font-size: .9rem; color: var(--text-dark);
  outline: none; transition: border-color .2s, box-shadow .2s;
}
.search-input::placeholder { color: var(--gray); }
.search-input:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px rgba(33,150,243,.12); }
.search-icon { position: absolute; right: 6px; width: 32px; height: 32px; border: none; background: none; border-radius: 50%; color: var(--blue-mid); cursor: pointer; display: flex; align-items: center; justify-content: center; }

.btn-map {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: 22px; border: 1.5px solid rgba(33,150,243,.35);
  background: rgba(255,255,255,.8); color: var(--blue-mid);
  font-family: var(--font-hud); font-size: .72rem; font-weight: 700;
  cursor: pointer; transition: all .2s; white-space: nowrap; flex-shrink: 0;
  letter-spacing: .04em;
}
.btn-map:hover, .btn-map.active {
  background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  color: #fff; border-color: transparent;
  box-shadow: 0 0 12px rgba(33,150,243,.35);
}

.main {
  flex: 1; display: flex; overflow: hidden; position: relative;
}

.lang-sidebar {
  width: 56px; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 16px 0; flex-shrink: 0;
}
.lang-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: 2px solid transparent;
  background: rgba(255,255,255,.75); backdrop-filter: blur(6px);
  cursor: pointer; font-family: var(--font-hud); font-size: .7rem; font-weight: 700;
  color: var(--text-mid);
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; box-shadow: var(--shadow-sm); letter-spacing: .02em;
}
.lang-btn:hover, .lang-btn.active {
  background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  color: #fff; box-shadow: 0 0 12px rgba(33,150,243,.4);
}

.character-stage {
  flex: 0 0 auto; width: 320px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  padding-bottom: 10px; position: relative;
}

.char-wrap {
  position: relative;
  width: 280px;
  height: 400px;
}

.char-img {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.35s ease;

  filter: drop-shadow(0 16px 32px rgba(21,101,192,.22));
  pointer-events: none;
}
.char-img.active { opacity: 1; }

.char-wrap.floating .char-img.active {
  animation: charFloat 3.5s ease-in-out infinite;
}
@keyframes charFloat {
  0%,100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-8px); }
}

.state-badge {
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.8); backdrop-filter: blur(6px);
  border: 1px solid rgba(33,150,243,.25); border-radius: 20px;
  padding: 3px 12px;
  font-family: var(--font-hud); font-size: .62rem; font-weight: 700;
  color: var(--blue-mid); letter-spacing: .1em;
  transition: all .3s;
}

/* right gutter keeps the floating mic button off the map and its controls */
.right-panel {
  flex: 1; display: flex; flex-direction: column;
  padding: 10px 96px 46px 6px;          /* bottom strip = READY / IP badges */
  gap: 10px; overflow: hidden; min-width: 0;
}

/* The map takes whatever height the answer card leaves free. */
.map-preview {
  flex: 1 1 0;
  min-height: 260px;
  display: flex; flex-direction: column;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--glass-brd);
  border: 1px solid rgba(255,255,255,.6);
  background: #eef2f6;
  position: relative;
  transition: flex-basis .35s cubic-bezier(.2,.7,.3,1);
}
.map-preview.expanded + .qa-pane { max-height: 26%; }
@media (prefers-reduced-motion: reduce) { .map-preview { transition: none; } }

.map-container { flex: 1; min-height: 0; }
.map-error { padding: 24px 16px; text-align: center; font-weight: 700; color: var(--text-mid); }

/* closure warning above the map (role=alert) */
.closure-banner {
  flex-shrink: 0; padding: 8px 14px;
  background: #fff4e5; color: #7a3d00; border-bottom: 2px solid #f7941d;
  font-size: .8rem; font-weight: 800; line-height: 1.45;
}
.closure-banner p + p { margin-top: 2px; }

.route-bar {
  background: rgba(255,255,255,.95);
  padding: 7px 12px; flex-shrink: 0;
  display: flex; align-items: flex-start; gap: 8px;
  border-top: 1px solid rgba(33,150,243,.12);
  max-height: 34%; overflow-y: auto;
}
.route-icon { color: var(--blue-mid); flex-shrink: 0; margin-top: 2px; }
.route-text { font-size: .78rem; font-weight: 600; color: var(--text-mid); flex: 1; min-width: 0; }
.route-text .route-highlight { color: var(--blue); font-weight: 800; }

.dir-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
  font-size: .8rem; font-weight: 800; color: var(--blue); margin-bottom: 6px;
}
.dir-actions { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.dir-qr-btn, .dir-floor-btn {
  border: none; border-radius: 12px; cursor: pointer;
  font-size: .7rem; font-weight: 800; padding: 4px 11px; min-height: 26px;
}
.dir-qr-btn { background: var(--blue); color: #fff; }
.dir-qr-btn:hover { background: var(--blue-mid); }
.dir-floor-btn { background: #fff3e0; color: #8a4a00; border: 1.5px solid #f7941d; }
.dir-floor-btn:hover { background: #ffe0b2; }
.dir-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.dir-list li {
  display: flex; align-items: center; gap: 8px;
  font-size: .74rem; color: var(--text-mid); font-weight: 600;
}
.dir-num {
  flex: 0 0 18px; height: 18px; border-radius: 50%; background: var(--blue-pale);
  color: var(--blue-mid); font-size: .62rem; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
}
.qr-modal {
  position: fixed; inset: 0; z-index: 2000; display: none;
  align-items: center; justify-content: center;
  background: rgba(13,40,70,.55); backdrop-filter: blur(4px);
}
.qr-modal.show { display: flex; }
.qr-card {
  background: #fff; border-radius: 18px; padding: 22px 24px; text-align: center;
  box-shadow: 0 12px 48px rgba(21,101,192,.35); max-width: 320px;
}
.qr-card img { width: 220px; height: 220px; image-rendering: pixelated; }
.qr-card h3 { font-family: var(--font-hud); color: var(--blue-mid); font-size: 1rem; margin-bottom: 12px; }
.qr-caption { font-size: .76rem; color: var(--gray); margin-top: 10px; }
.qr-close {
  margin-top: 14px; border: none; background: var(--blue-mid); color: #fff;
  border-radius: 22px; padding: 8px 22px; font-weight: 700; font-size: .8rem; cursor: pointer;
}

.qa-pane {
  flex: 0 1 auto;
  max-height: 42%;
  transition: max-height .35s cubic-bezier(.2,.7,.3,1);
  display: flex; flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 2px 6px 8px 0;
  scroll-padding-bottom: 8px;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: rgba(21,101,192,.45) transparent;
  min-height: 0;
}
.qa-pane::-webkit-scrollbar { width: 8px; }
.qa-pane::-webkit-scrollbar-thumb { background: rgba(21,101,192,.45); border-radius: 4px; }
.qa-pane::-webkit-scrollbar-thumb:hover { background: rgba(21,101,192,.7); }

.user-question {
  align-self: flex-end; max-width: 78%;
  background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
  color: #fff; padding: 10px 16px;
  border-radius: 16px 16px 4px 16px;
  font-size: .9rem; font-weight: 600; line-height: 1.5;
  box-shadow: var(--shadow-sm); flex-shrink: 0;
  opacity: 0; transform: translateX(14px);
  transition: opacity .35s ease, transform .35s ease;
}
.user-question.visible { opacity: 1; transform: translateX(0); }

.bot-answer-card {
  flex-shrink: 0;
  background: rgba(255,255,255,.82); backdrop-filter: blur(14px) saturate(1.3);
  border-radius: var(--radius); padding: 17px 21px;
  box-shadow: var(--shadow-lg), inset 0 1px 0 var(--glass-brd);
  border-left: 4px solid var(--blue-light);
  opacity: 0; transform: translateY(10px);
  transition: opacity .4s ease .1s, transform .4s cubic-bezier(.2,.7,.3,1) .1s;
}
.bot-answer-card.visible { opacity: 1; transform: translateY(0); }

.answer-text { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.answer-meta { margin-top: 6px; font-size: .65rem; color: var(--gray); font-family: var(--font-hud); letter-spacing: .06em; }

.thinking { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.thinking span {
  width: 8px; height: 8px; background: var(--blue-light); border-radius: 50%;
  animation: think .85s ease-in-out infinite;
}
.thinking span:nth-child(2) { animation-delay: .14s; }
.thinking span:nth-child(3) { animation-delay: .28s; }
@keyframes think {
  0%,80%,100% { transform: scale(1); opacity: .35; }
  40%          { transform: scale(1.45); opacity: 1; }
}

.mic-fab {
  position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
  width: 58px; height: 58px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--blue-mid), var(--cyan));
  color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(33,150,243,.45), inset 0 1px 2px rgba(255,255,255,.5);
  transition: transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .25s; z-index: 20;
}
.mic-fab:hover { transform: translateY(-52%) scale(1.08); box-shadow: 0 8px 26px rgba(33,150,243,.55), inset 0 1px 2px rgba(255,255,255,.5); }
.mic-fab.recording {
  background: linear-gradient(135deg, #e53935, #ff7043);
  box-shadow: 0 0 0 4px rgba(229,57,53,.2), 0 4px 18px rgba(229,57,53,.4);
  animation: micPulse 1s ease-in-out infinite;
}
@keyframes micPulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(229,57,53,.2), 0 4px 16px rgba(229,57,53,.35); }
  50%      { box-shadow: 0 0 0 10px rgba(229,57,53,.08), 0 4px 24px rgba(229,57,53,.5); }
}

.mic-ring {
  position: absolute; right: 18px; top: 50%;
  transform: translateY(-50%);
  width: 64px; height: 64px; border-radius: 50%;
  border: 2px solid var(--blue-light);
  pointer-events: none; opacity: 0; z-index: 19;
  animation: ring 1.3s ease-out infinite;
}
.mic-ring.active { opacity: .55; }
@keyframes ring {
  from { transform: translateY(-50%) scale(1); opacity: .55; }
  to   { transform: translateY(-50%) scale(1.7); opacity: 0; }
}

.status-pill {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,.85); backdrop-filter: blur(8px);
  border: 1px solid rgba(33,150,243,.2); border-radius: 30px;
  padding: 4px 14px;
  font-family: var(--font-hud); font-size: .65rem; font-weight: 600;
  letter-spacing: .1em; color: var(--blue-mid);
  display: flex; align-items: center; gap: 6px;
  box-shadow: var(--shadow-sm);
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #43e97b; box-shadow: 0 0 6px #43e97b;
  animation: blink 2s ease-in-out infinite;
}
.status-dot.busy    { background: var(--blue-light); box-shadow: 0 0 8px var(--blue-light); animation: none; }
.status-dot.recording { background: #e53935; box-shadow: 0 0 8px #e53935; animation: blink .5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }

footer {
  text-align: center; padding: 4px;
  font-size: .62rem; color: var(--gray); flex-shrink: 0; letter-spacing: .05em;
}

.btn-quiet.active {
  background: linear-gradient(135deg, #ef5350, #e53935);
  color: #fff; border-color: transparent;
  box-shadow: 0 0 12px rgba(229,57,53,.35);
}

.feedback-row { display: flex; gap: 8px; margin-top: 10px; }
.fb-btn {
  padding: 4px 14px; border-radius: 14px;
  border: 1.5px solid rgba(33,150,243,.3);
  background: rgba(255,255,255,.75);
  font-size: .82rem; cursor: pointer; transition: all .2s;
}
.fb-btn:hover { background: var(--blue-pale); border-color: var(--blue-light); transform: translateY(-1px); }
.fb-btn:active { transform: scale(.94); }
a.btn-map { text-decoration: none; }
.fb-thanks { font-size: .82rem; color: var(--gray); align-self: center; }
.fb-more {
  font-size: .82rem; font-weight: 600; color: var(--blue-mid);
  text-decoration: none; align-self: center;
}
.fb-more:hover { text-decoration: underline; }

.btn-refresh, .btn-map, .lang-btn, .mic-fab, .fb-btn, .dir-qr-btn, .dir-floor-btn, .qr-close, .chip {
  -webkit-tap-highlight-color: transparent;
}
.btn-refresh:active, .btn-map:active, .lang-btn:active,
.fb-btn:active, .dir-qr-btn:active, .dir-floor-btn:active, .chip:active { transform: scale(.93); }
.mic-fab:active { transform: translateY(-50%) scale(.92); }
/* visible keyboard focus everywhere (BINUS orange ring) */
button:focus-visible, a:focus-visible, .search-input:focus-visible, .chip:focus-visible {
  outline: 3px solid #f7941d; outline-offset: 2px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* room search results */
.search-results {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 300;
  list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow-y: auto;

}
.search-results[hidden] { display: none; }
.sr-item {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 12px; border-radius: 10px; cursor: pointer; min-height: 40px;
}
.sr-item:hover, .sr-item.active { background: #e8f1fb; }
.sr-name { font-weight: 800; color: var(--text-dark); font-size: .88rem; }
.sr-floor { font-size: .72rem; font-weight: 700; color: #4a5d70; }
.sr-empty { padding: 10px 12px; font-size: .8rem; color: #4a5d70; font-weight: 600; }
.status-badge {
  margin-left: auto; padding: 2px 9px; border-radius: 10px;
  font-size: .7rem; font-weight: 800; white-space: nowrap;
}
.status-closed { background: #1f2937; color: #fff; }
.status-under_construction { background: #7c2d12; color: #fff; }

.welcome { display: flex; flex-direction: column; gap: 12px; }
.welcome-greet {
  font-size: 1.15rem; font-weight: 800; color: var(--text-dark); line-height: 1.4;
}
.welcome-greet .wave { display: inline-block; animation: wave 2.2s ease-in-out infinite; transform-origin: 70% 70%; }
@keyframes wave { 0%,60%,100%{transform:rotate(0)} 10%{transform:rotate(14deg)} 20%{transform:rotate(-8deg)} 30%{transform:rotate(14deg)} 40%{transform:rotate(-4deg)} 50%{transform:rotate(10deg)} }
.welcome-sub { font-size: .82rem; color: var(--gray); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 20px; cursor: pointer;
  background: rgba(255,255,255,.7); border: 1.5px solid rgba(33,150,243,.22);

  box-shadow: var(--shadow-sm); transition: all .2s;
}
.chip:hover { background: var(--grad-blue); color: #fff; border-color: transparent;
  transform: translateY(-2px); box-shadow: 0 6px 16px rgba(33,150,243,.3); }
.chip .chip-ico { font-size: .95rem; }

@media (max-width: 1100px) {
  .character-stage { width: 240px; }
  .char-wrap       { width: 210px; height: 300px; }
}
@media (max-width: 768px) {
  /* Phones: the page scrolls normally; only the map captures touch gestures. */
  html, body       { height: auto; overflow: auto; }
  .shell           { height: auto; min-height: 100vh; min-height: 100dvh; }
  .main            { overflow: visible; }
  .character-stage { display: none; }
  .lang-sidebar    { width: 44px; justify-content: flex-start; padding-top: 12px; }
  .right-panel     { padding: 6px 8px 96px; overflow: visible; }
  .map-preview     { flex: none; height: 64vh; min-height: 340px; }
  .map-preview.expanded { height: 76vh; }
  .qa-pane, .map-preview.expanded + .qa-pane { max-height: none; overflow: visible; }
  .mic-fab         { position: fixed; right: 14px; top: auto; bottom: 16px; transform: none; width: 56px; height: 56px; }
  .mic-fab:hover   { transform: scale(1.05); }
  .mic-fab:active  { transform: scale(.92); }
  .mic-ring        { position: fixed; right: 10px; top: auto; bottom: 12px; transform: none; animation: none; }
  header           { padding: 8px 12px; }
  .header-center   { font-size: .75rem; gap: 8px; }

  #ip-pill         { display: none !important; }
}

updateClock(); setInterval(updateClock, 1000);

let currentLang   = 'IND';
let quietMode     = false;
const LANG_TO_CODE = { 'IND': 'id', 'ENG': 'en', 'ZH': 'zh' };

const BG_THRESHOLD = 40;

function removeBlackBg(canvas, src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];
        if (r < BG_THRESHOLD && g < BG_THRESHOLD && b < BG_THRESHOLD) {
          data[i+3] = 0;
        } else {
          const brightness = Math.max(r, g, b);
          if (brightness < BG_THRESHOLD * 2) {
            data[i+3] = Math.round(255 * (brightness - BG_THRESHOLD) / BG_THRESHOLD);
          }
        }
      }
      ctx.putImageData(imageData, 0, 0);
      resolve();
    };
    img.onerror = () => { console.warn('Model image not found:', src); resolve(); };
    img.src = src;
  });
}

async function loadAllModels() {
  const canvases = document.querySelectorAll('canvas.char-img');
  await Promise.all([...canvases].map(c => removeBlackBg(c, c.dataset.src)));
  console.log('[Models] All character images loaded.');
}

let currentState    = 'idle';
let stateTimer      = null;

const STATE_LABELS = {
  idle:     'IDLE',
  speak:    'SPEAKING',
  thinking: 'THINKING',
  waving:   'WAVING',
  default:  'READY',
};

function setCharState(state, durationMs = 0) {
  if (stateTimer) { clearTimeout(stateTimer); stateTimer = null; }

  const floatStates = ['idle', 'default'];
  charWrap.classList.toggle('floating', floatStates.includes(state));

  Object.entries(imgMap).forEach(([k, el]) => {
    el.classList.toggle('active', k === state);
  });

  currentState = state;
  stateBadge.textContent = STATE_LABELS[state] || state.toUpperCase();

  if (durationMs > 0) {
    stateTimer = setTimeout(() => setCharState('idle'), durationMs);
  }
}

window.addEventListener("load", async () => {
  setCharState('waving', 2800);
  loadAllModels();
  renderWelcome();
  routeText.textContent = rt().pick;
  await loadRooms();
  await loadClosures();          // before the map, so closures are drawn right away
  initMap();
  setInterval(loadClosures, 60000);
});

function setLang(btn) {
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b === btn);
    b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
  });
  currentLang = btn.dataset.lang;
  document.documentElement.lang = { IND: 'id', ENG: 'en', ZH: 'zh' }[currentLang] || 'id';
  if (recognition) recognition.lang = _browserLang();
  searchInput.placeholder = { IND: 'Cari ruangan (mis. C0207) atau tanya…', ENG: 'Search a room (e.g. C0207) or ask…',
                              ZH: '搜索房间（例如 C0207）或提问…' }[currentLang];
  if (!userQ.classList.contains('visible')) renderWelcome();
  if (floorMap) floorMap.setText(MAP_TEXT[currentLang] || MAP_TEXT.IND);
  if (activeRoute) routeTo(activeRoute.dest);
  else routeText.textContent = rt().pick;
  if (!searchResults.hidden) renderSearchResults();
}

function setStatus(msg, mode = 'idle') {
  statusText.textContent = msg;
  statusDot.className = 'status-dot' + (mode !== 'idle' ? ' ' + mode : '');
}

function toggleMap() {
  const preview = document.getElementById('map-preview');
  const open = !preview.classList.contains('expanded');
  preview.classList.toggle('expanded', open);
  document.getElementById('btn-map').classList.toggle('active', open);
  document.getElementById('btn-map').setAttribute('aria-pressed', open ? 'true' : 'false');
}

function expandMap() {
  document.getElementById('map-preview').classList.add('expanded');
  document.getElementById('btn-map').classList.add('active');
  document.getElementById('btn-map').setAttribute('aria-pressed', 'true');
}

/* ── Map, routing & closures ───────────────────────────────────────────────
   Floor plans, rooms and the kiosk position come from /rooms.json; the map
   itself is static/js/floor-map.js (pan & zoom), routes come from
   static/js/routing.js, and active closures from /api/closures. */

const MAP_TEXT = {
  IND: {
    floorsLabel: 'Pilih lantai', zoomIn: 'Perbesar', zoomOut: 'Perkecil', fit: 'Tampilkan seluruh peta',
    loading: 'Memuat peta…', unavailable: 'Peta tidak tersedia',

    warnRoom: (name, label) => `⚠ ${name} ${label.toLowerCase()}.`,
    warnPath: floor => `⚠ Rute melewati area yang sedang ditutup/direnovasi di ${floor}.`,
    floorN: n => `Lantai ${n}`,
    results: 'Hasil pencarian ruangan', noResults: 'Ruangan tidak ditemukan — tekan Enter untuk bertanya ke AI.',
  },
  ENG: {
    straight: m => `Go straight ±${m} m`,
    turn: (dir, near) => `Turn ${dir}${near ? ' near ' + near : ''}`,
    arrive: name => `${name} is in front of you`,
    takeTo: (via, floor) => `Take the ${via} to ${floor}`,
    exit: (via, floor) => `Leave the ${via} on ${floor}`,
    stairsTo: (from, to) => `On ${from}, take the emergency stairs to ${to}`,
    heading: (name, m) => `To ${name} — ±${m} m (~${Math.round(m / 0.75)} steps)`,
    here: name => `You are already at ${name}`,
    noMap: (name, floor) => `${name} is on ${floor}.`,
    showFloor: floor => `Show ${floor} →`,
    sendPhone: 'Send to phone',
    pick: 'Pick a room or ask the AI for directions.',
    warnRoom: (name, label) => `⚠ ${name}: ${label.toLowerCase()}.`,
    warnPath: floor => `⚠ This route passes an area that is closed or under construction on ${floor}.`,
    floorN: n => `Floor ${n}`,
    results: 'Room search results', noResults: 'No room found — press Enter to ask the AI.',
  },
  ZH: {
    straight: m => `直走约 ${m} 米`,
    turn: (dir, near) => `${dir === 'right' ? '右转' : '左转'}${near ? '（' + near + ' 附近）' : ''}`,
    arrive: name => `${name} 就在您面前`,

    exit: (via, floor) => `在 ${floor} 离开 ${via}`,
    stairsTo: (from, to) => `在 ${from} 走紧急楼梯到 ${to}`,
    heading: (name, m) => `前往 ${name} — 约 ${m} 米`,

    noMap: (name, floor) => `${name} 位于 ${floor}。`,
    showFloor: floor => `查看 ${floor} →`,

    pick: '选择房间或询问 AI 获取路线。',
    warnRoom: (name, label) => `⚠ ${name}：${label}。`,
    warnPath: floor => `⚠ 路线经过 ${floor} 的关闭或施工区域。`,
    floorN: n => `${n} 楼`,
    results: '房间搜索结果', noResults: '未找到房间 — 按 Enter 询问 AI。',
  },
};
const rt = () => ROUTE_TEXT[currentLang] || ROUTE_TEXT.IND;

let MAP_DATA   = null;
let ROOMS      = [];
let KIOSK      = null;          // { floor, room }
let CLOSURES   = [];
let floorMap   = null;
let activeRoute = null;         // { dest, legs, steps, metres }
let lastDirectionsText = '';

const roomById  = id => ROOMS.find(r => r.id === id);
const LANG_KEY  = () => ({ ENG: 'en', ZH: 'zh' })[currentLang];
const roomName  = r => (LANG_KEY() && r[`name_${LANG_KEY()}`]) || r.name;
const roomPlace = r => (LANG_KEY() ? r[`location_${LANG_KEY()}`] : r.location) || (currentLang === 'IND' ? r.location : '') || '';
const VIA_NAMES = { Eskalator: { ENG: 'escalator', ZH: '扶梯' }, Lift: { ENG: 'lift', ZH: '电梯' } };
const viaName   = name => (VIA_NAMES[name] && VIA_NAMES[name][currentLang]) || name;
const floorDef  = n => MAP_DATA && MAP_DATA.floors.find(f => f.floor === n);
const floorName = n => { const f = floorDef(n); return currentLang === 'IND' && f ? f.label : rt().floorN(n); };
/** A floor's access rule ("students reach Lantai 3 only by the emergency stairs…") in the UI language, or ''. */
const floorAccessNote = n => { const a = floorDef(n) && floorDef(n).access; return a ? (LANG_KEY() && a[`note_${LANG_KEY()}`]) || a.note : ''; };

async function loadRooms() {
  try {
    const res = await fetch('/rooms.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    MAP_DATA = await res.json();
    ROOMS = MAP_DATA.rooms || [];
    KIOSK = MAP_DATA.kiosk;
  } catch (e) {
    console.error('[Rooms] failed to load rooms.json:', e);
    const box = document.getElementById('map-container');
    box.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'map-error';
    msg.textContent = currentLang === 'IND' ? 'Peta tidak dapat dimuat. Coba muat ulang halaman.'
                                            : 'The map could not be loaded. Try reloading the page.';
    box.appendChild(msg);
  }
}

function initMap() {
  if (floorMap || !MAP_DATA) return;
  floorMap = new FloorMap(document.getElementById('map-container'), {
    data: MAP_DATA,
    mode: 'user',
    text: MAP_TEXT[currentLang] || MAP_TEXT.IND,
    initialFloor: KIOSK ? KIOSK.floor : 1,
    // tapping a room = same as picking it in search, but the map stays on that floor
    onRoomClick: room => { showRoomCard(room); routeTo(room, { viewFloor: room.floor }); speakRoom(room); },
  });
  const kRoom = KIOSK && roomById(KIOSK.room);
  if (kRoom && kRoom.poly) floorMap.setKiosk(kRoom.floor, Routing.roomCentre(kRoom));
  floorMap.setClosures(CLOSURES);
}

async function loadClosures() {
  try {
    const res = await fetch('/api/closures', { cache: 'no-cache' });
    if (!res.ok) return;
    CLOSURES = (await res.json()).closures || [];
  } catch (_) { return; }          // offline: keep the last known list
  if (floorMap) floorMap.setClosures(CLOSURES);
  if (activeRoute) updateClosureBanner(activeRoute.dest, activeRoute.legs);
  if (!searchResults.hidden) renderSearchResults();
}

function closureFor(room) {
  return room && CLOSURES.find(c => c.roomId === room.id);
}

function statusLabel(c) {
  return (MAP_TEXT[currentLang] || MAP_TEXT.IND)[c.status] || c.status;
}

/** Routing still shows the way, but warn when the destination or the path
    touches a closed / under-construction area. */
function updateClosureBanner(dest, legs) {
  const banner = document.getElementById('closure-banner');
  const lines = [];
  const T = rt();
  for (const c of CLOSURES) {
    const poly = floorMap ? floorMap.closurePoly(c) : null;
    if (!poly) continue;
    const room = c.roomId && roomById(c.roomId);
    const isDest = dest && c.roomId === dest.id;
    const leg = legs && legs[c.floor];
    const onPath = leg && Routing.pathTouchesPoly(leg.points, poly);
    if (!isDest && !onPath) continue;
    let line = room ? T.warnRoom(room.name, statusLabel(c)) : T.warnPath(floorName(c.floor));
    if (c.note) line += ' ' + c.note;
    lines.push(line);
  }
  banner.textContent = '';
  lines.forEach(l => { const p = document.createElement('p'); p.textContent = l; banner.appendChild(p); });
  banner.hidden = !lines.length;
}

async function routeTo(dest, { viewFloor } = {}) {
  if (!MAP_DATA || !dest) return;
  initMap();
  expandMap();
  const T = rt();
  const kRoom = KIOSK && roomById(KIOSK.room);
  floorMap.highlightRoom(dest.poly ? dest : null);
  const legs = {};
  let steps = [], metres = 0;

  if (!kRoom || !kRoom.poly) {
    floorMap.showFloor(dest.floor);
    floorMap.setRoute({});
    setRouteMessage(dest.poly ? dest.name : T.noMap(dest.name, floorName(dest.floor)));
  } else if (dest.id === kRoom.id) {
    floorMap.showFloor(dest.floor);
    floorMap.setRoute({});
    setRouteMessage(T.here(dest.name));
  } else {
    const kFloor = floorDef(kRoom.floor);
    const start = Routing.roomCentre(kRoom);
    if (dest.floor === kRoom.floor && dest.poly) {
      const pts = await Routing.route(kFloor, ROOMS, start, Routing.roomCentre(dest), [kRoom.id, dest.id]);
      legs[kFloor.floor] = { points: pts, start: { kind: 'you', label: MAP_TEXT[currentLang].you }, end: { kind: 'end', label: dest.name } };
      steps = Routing.steps(pts, ROOMS, kFloor, dest.name, T);
      metres = Routing.metres(pts, kFloor);
    } else {
      const dFloor = floorDef(dest.floor);
      const via = kFloor.connector;
      // A floor reached only by the emergency stairs: connector to the nearest allowed floor, then the stairs.
      // (The stairs have no map position yet, so that floor gets no route line.)
      const access = dFloor && dFloor.access;
      const viaFloor = access
        ? access.via_floors.reduce((a, b) => (Math.abs(b - kRoom.floor) < Math.abs(a - kRoom.floor) ? b : a))
        : dest.floor;
      const p1 = await Routing.route(kFloor, ROOMS, start, via.xy, [kRoom.id]);
      legs[kFloor.floor] = { points: p1, start: { kind: 'you', label: MAP_TEXT[currentLang].you }, end: { kind: 'connector', label: viaName(via.name) } };
      steps = Routing.steps(p1, ROOMS, kFloor, viaName(via.name), T);
      steps.pop();
      steps.push(T.takeTo(viaName(via.name), floorName(viaFloor)));
      metres = Routing.metres(p1, kFloor);
      if (access) {
        steps.push(T.stairsTo(floorName(viaFloor), floorName(dest.floor)));
        steps.push(roomPlace(dest) ? `${dest.name} — ${roomPlace(dest)}` : T.noMap(dest.name, floorName(dest.floor)));
      } else if (dFloor && dest.poly) {
        const p2 = await Routing.route(dFloor, ROOMS, dFloor.connector.xy, Routing.roomCentre(dest), [dest.id]);
        legs[dFloor.floor] = { points: p2, start: { kind: 'connector', label: viaName(dFloor.connector.name) }, end: { kind: 'end', label: dest.name } };
        steps.push(T.exit(viaName(dFloor.connector.name), floorName(dest.floor)));
        steps.push(...Routing.steps(p2, ROOMS, dFloor, dest.name, T));
        metres += Routing.metres(p2, dFloor);
      } else {
        steps.push(roomPlace(dest) ? `${dest.name} — ${roomPlace(dest)}` : T.noMap(dest.name, floorName(dest.floor)));
      }
    }
    floorMap.showFloor(viewFloor && legs[viewFloor] ? viewFloor : kRoom.floor);
    floorMap.setRoute(legs);
    showDirections(dest, metres, steps, legs);
  }
  activeRoute = { dest, legs };
  updateClosureBanner(dest, legs);
}

function setRouteMessage(text) {
  routeText.textContent = '';
  const span = document.createElement('span');
  span.className = 'route-highlight';
  span.textContent = text;
  routeText.appendChild(span);
  lastDirectionsText = text;
}

function showDirections(dest, metres, steps, legs) {
  const T = rt();
  routeText.textContent = '';
  const head = document.createElement('div');
  head.className = 'dir-head';
  head.append(T.heading(dest.name, metres));
  const actions = document.createElement('span');
  actions.className = 'dir-actions';
  for (const n of Object.keys(legs).map(Number).sort((a, b) => a - b)) {
    if (n === floorMap.current && Object.keys(legs).length === 1) continue;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dir-floor-btn';
    b.dataset.action = 'showLeg';
    b.dataset.floor = n;
    b.textContent = floorName(n);
    actions.appendChild(b);
  }
  const qr = document.createElement('button');
  qr.type = 'button';
  qr.className = 'dir-qr-btn';
  qr.dataset.action = 'showRouteQR';
  qr.textContent = T.sendPhone;
  actions.appendChild(qr);
  head.appendChild(actions);
  const list = document.createElement('ol');
  list.className = 'dir-list';
  steps.forEach((s, i) => {
    const li = document.createElement('li');
    const num = document.createElement('span');
    num.className = 'dir-num';
    num.textContent = i + 1;
    li.append(num, s);
    list.appendChild(li);
  });
  routeText.append(head, list);
  lastDirectionsText = `${T.heading(dest.name, metres)}\n` + steps.map((s, i) => `${i + 1}. ${s}`).join('\n');
}

function showLeg(el) {
  const n = Number(el.dataset.floor);
  if (!floorMap || !floorDef(n)) return;
  floorMap.showFloor(n);
  floorMap.focusLeg();
}

function clearRoute() {
  activeRoute = null;
  if (floorMap) floorMap.clearRoute();
  document.getElementById('closure-banner').hidden = true;
  routeText.textContent = rt().pick;
  const preview = document.getElementById('map-preview');
  if (preview) preview.classList.remove('expanded');
  document.getElementById('btn-map').classList.remove('active');
}

/* ── Room search (type-ahead) ─────────────────────────────────────────── */

const searchResults = document.getElementById('search-results');
let searchHits = [];
let searchIndex = -1;

const normalise = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '');

const HAS_CJK = /[\u3400-\u9fff]/;
const searchable = q => normalise(q).length >= 2 || HAS_CJK.test(q);

function findRooms(q) {
  if (HAS_CJK.test(q)) {                       // Mandarin: match the Chinese room names
    const t = q.replace(/[\s？?在哪里儿怎么去的位置]/g, '');
    return ROOMS.filter(r => r.name_zh && t && (r.name_zh.includes(t) || t.includes(r.name_zh.split('（')[0])))
                .sort((a, b) => a.floor - b.floor).slice(0, 8);
  }
  const nq = normalise(q);
  if (nq.length < 2) return [];
  const scored = [];
  for (const r of ROOMS) {
    const keys = [r.name, r.id, r.name_en, ...(r.aliases || [])].filter(Boolean).map(normalise);
    let score = 0;
    for (const k of keys) {
      if (k === nq) score = Math.max(score, 3);
      else if (k.startsWith(nq)) score = Math.max(score, 2);
      else if (k.includes(nq)) score = Math.max(score, 1);
    }
    if (score) scored.push([score, r]);
  }
  return scored.sort((a, b) => b[0] - a[0] || a[1].floor - b[1].floor || a[1].name.localeCompare(b[1].name))
               .slice(0, 8).map(x => x[1]);
}

function renderSearchResults() {
  searchHits = findRooms(searchInput.value);
  searchResults.textContent = '';
  if (!searchInput.value.trim() || !searchable(searchInput.value)) {
    closeSearchResults();
    return;
  }
  if (!searchHits.length) {
    const li = document.createElement('li');
    li.className = 'sr-empty';
    li.textContent = rt().noResults;
    searchResults.appendChild(li);
  }
  searchHits.forEach((room, i) => {
    const li = document.createElement('li');
    li.id = 'sr-' + i;
    li.setAttribute('role', 'option');
    li.className = 'sr-item' + (i === searchIndex ? ' active' : '');
    li.setAttribute('aria-selected', i === searchIndex ? 'true' : 'false');
    li.dataset.action = 'pickRoom';
    li.dataset.id = room.id;
    const name = document.createElement('span');
    name.className = 'sr-name';
    name.textContent = roomName(room);
    const floor = document.createElement('span');
    floor.className = 'sr-floor';
    floor.textContent = floorName(room.floor);
    li.append(name, floor);
    const c = closureFor(room);
    if (c) {
      const badge = document.createElement('span');
      badge.className = 'status-badge status-' + c.status;
      badge.textContent = (c.status === 'closed' ? '⛔ ' : '🚧 ') + statusLabel(c);
      if (c.note) badge.title = c.note;
      li.appendChild(badge);
    }
    searchResults.appendChild(li);
  });
  searchResults.hidden = false;
  searchInput.setAttribute('aria-expanded', 'true');
  searchInput.setAttribute('aria-activedescendant', searchIndex >= 0 ? 'sr-' + searchIndex : '');
}

function closeSearchResults() {
  searchResults.hidden = true;
  searchIndex = -1;
  searchInput.setAttribute('aria-expanded', 'false');
  searchInput.removeAttribute('aria-activedescendant');
}

function pickRoom(room) {
  if (!room) return;
  closeSearchResults();
  searchInput.value = '';
  showRoomCard(room);
  routeTo(room);
  speakRoom(room);
}

/** Say the room's answer (same words and voice as the assistant), unless Quiet is on. */
async function speakRoom(room) {
  if (quietMode || !room) return;
  try {
    const res = await fetch(`/api/room-answer/${encodeURIComponent(room.id)}?lang=${currentLang}`);
    if (!res.ok) return;
    const data = await res.json();
    await playResponse(data);       // human recording when the room has one, like a typed question
  } catch (e) {
    console.warn('[Voice] room answer failed:', e);
  }
}

function scrollAnswerIntoView() {
  const pane = document.getElementById('pane-qa');
  setTimeout(() => { if (pane) pane.scrollTop = pane.scrollHeight; }, 60);
}

/** Answer card for a room: name, floor, location and closure status, in the UI language. */
function showRoomCard(room) {
  showQuestion(roomName(room));
  const c = closureFor(room);
  const place = roomPlace(room);
  let text = place ? `${roomName(room)} — ${floorName(room.floor)}, ${place}` : `${roomName(room)} — ${floorName(room.floor)}`;
  const note = floorAccessNote(room.floor);
  if (note) text += `\nℹ ${note}${currentLang === 'ZH' ? '。' : '.'}`;
  if (c) text += `\n${c.status === 'closed' ? '⛔' : '🚧'} ${statusLabel(c)}${c.note ? ': ' + c.note : ''}`;
  answerText.textContent = '';
  const div = document.createElement('div');
  div.className = 'answer-text';
  div.textContent = text;
  answerText.appendChild(div);
  botCard.classList.add('visible');
  scrollAnswerIntoView();
}

function handleSearchKey(e) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!searchHits.length) return;
    e.preventDefault();
    const n = searchHits.length;
    searchIndex = e.key === 'ArrowDown' ? (searchIndex + 1) % n : (searchIndex - 1 + n) % n;
    renderSearchResults();
  } else if (e.key === 'Escape') {
    closeSearchResults();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchIndex >= 0 && searchHits[searchIndex]) pickRoom(searchHits[searchIndex]);
    else submitSearch();
  }
}

function submitSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  if (q.length > CHAT_MAX_CHARS) {
    showQuestion(q.slice(0, 80) + '…');
    showAnswer(currentLang === 'IND' ? `Pertanyaan terlalu panjang (maks. ${CHAT_MAX_CHARS} karakter).`
                                     : `Question is too long (max ${CHAT_MAX_CHARS} characters).`, 0, false);
    return;
  }
  closeSearchResults();
  searchInput.value = '';
  showQuestion(q);
  askBot(q);
}

function showQuestion(text) {
  userQ.textContent = text;
  userQ.classList.add('visible');
}

function showThinking() {
  botCard.classList.add('visible');
  answerText.innerHTML =
    `<div class="thinking"><span></span><span></span><span></span></div>`;
}

function showAnswer(text, confidence, withFeedback = true) {
  answerText.textContent = '';
  const a = document.createElement('div');
  a.className = 'answer-text';
  a.textContent = text;                  // plain text only — never HTML
  answerText.appendChild(a);
  if (withFeedback) {
    const meta = document.createElement('div');
    meta.className = 'answer-meta';
    meta.textContent = `CONFIDENCE: ${confidence}%`;
    const row = document.createElement('div');
    row.className = 'feedback-row';
    const fb = { IND: ['Membantu', 'Tidak'], ENG: ['Helpful', 'Not helpful'], ZH: ['有帮助', '没帮助'] }[currentLang] || ['Membantu', 'Tidak'];
    row.innerHTML = `<button class="fb-btn" type="button" data-action="feedbackYes">${fb[0]}</button>`
                  + `<button class="fb-btn" type="button" data-action="feedbackNo">${fb[1]}</button>`;
    answerText.append(meta, row);
  }
  botCard.classList.add('visible');
  const pane = document.getElementById('pane-qa');
  setTimeout(() => { if (pane) pane.scrollTop = pane.scrollHeight; }, 200);
}

const _SpeechAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let useBrowserSTT = !!_SpeechAPI;

function _browserLang() {
  return { 'IND': 'id-ID', 'ENG': 'en-US', 'ZH': 'zh-CN' }[currentLang] || 'id-ID';
}

if (_SpeechAPI) {
  recognition = new _SpeechAPI();
  recognition.continuous      = false;
  recognition.interimResults  = false;
  recognition.maxAlternatives = 1;
  recognition.lang            = _browserLang();

  recognition.onresult = evt => {
    const transcript = (evt.results[0][0].transcript || '').trim();
    micBtn.classList.remove('recording');
    recording = false;
    if (!transcript) { setStatus('READY'); setCharState('idle'); return; }
    searchInput.value = transcript;
    showQuestion(transcript);
    askBot(transcript);
  };

  recognition.onerror = evt => {
    console.warn('[STT browser]', evt.error);
    micBtn.classList.remove('recording');
    recording = false;
    if (evt.error === 'not-allowed' || evt.error === 'service-not-allowed') {
      useBrowserSTT = false;
    }
    setStatus('READY'); setCharState('idle');
  };

  recognition.onend = () => {
    if (recording) {
      micBtn.classList.remove('recording');
      recording = false;
      setStatus('READY'); setCharState('idle');
    }
  };
}

async function startRecording() {
  if (recording) return;
  playAudioUrl('/audio/ready').catch(() => {});

  if (useBrowserSTT && recognition) {
    try {
      recognition.lang = _browserLang();
      recognition.start();
      recording = true;
      micBtn.classList.add('recording');
      setStatus('LISTENING…', 'recording');
      setCharState('waving');
      return;
    } catch (e) {
      console.warn('[STT] browser start failed, switching to Whisper:', e);
      useBrowserSTT = false;
    }
  }
  _startWhisper();
}

async function stopRecording() {
  if (!recording) return;
  if (useBrowserSTT && recognition) {
    recognition.stop();
    setStatus('PROCESSING…', 'busy');
    setCharState('thinking');
  } else {
    _stopWhisper();
  }
}

async function _startWhisper() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    recording = true;
    micBtn.classList.add('recording');
    setStatus('LISTENING…', 'recording');
    setCharState('waving');
  } catch (err) {
    console.error('Mic error:', err);
    setStatus('MIC DENIED');
  }
}

async function _stopWhisper() {
  if (!mediaRecorder) return;
  recording = false;
  micBtn.classList.remove('recording');
  setStatus('PROCESSING…', 'busy');
  setCharState('thinking');
  mediaRecorder.stop();
  await new Promise(res => mediaRecorder.addEventListener('stop', res, { once: true }));
  stream.getTracks().forEach(t => t.stop());

  const blob = new Blob(audioChunks, { type: 'audio/webm' });
  const fd   = new FormData();
  fd.append('audio', blob, 'rec.webm');
  fd.append('lang', currentLang);

  try {
    const res  = await fetch('/transcribe', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.error || !data.transcript) {
      setStatus('NOT UNDERSTOOD'); setCharState('idle'); return;
    }
    searchInput.value = data.transcript;
    showQuestion(data.transcript);
    if (data.detected_lang) {
      const m = { 'id': 'IND', 'en': 'ENG', 'zh': 'ZH' };
      const nl = m[data.detected_lang];
      if (nl && nl !== currentLang) {
        const b = document.querySelector(`[data-lang="${nl}"]`);
        if (b) b.click();
      }
    }
    await askBot(data.transcript);
  } catch (err) {
    console.error(err);
    setStatus('NETWORK ERROR'); setCharState('idle');
  }
}

const CHAT_ERRORS = {
  IND: { busy: 'Terlalu banyak pertanyaan — tunggu sebentar lalu coba lagi.',
         timeout: 'Asisten terlalu lama menjawab — silakan coba lagi.',
         network: 'Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.',
         generic: 'Maaf, asisten sedang tidak tersedia. Silakan coba lagi sebentar lagi.' },
  ENG: { busy: 'Too many questions — please wait a moment and try again.',
         timeout: 'The assistant took too long to answer — please try again.',
         network: "Can't reach the server. Check the connection and try again.",
         generic: 'Sorry, the assistant is unavailable right now. Please try again shortly.' },
  ZH:  { busy: '提问过于频繁 — 请稍后再试。', timeout: '助手响应超时 — 请重试。',
         network: '无法连接服务器，请检查网络后重试。', generic: '抱歉，助手暂时不可用，请稍后再试。' },
};

function friendlyChatError(status, data) {
  const E = CHAT_ERRORS[currentLang] || CHAT_ERRORS.IND;
  if (status === 429) return E.busy;
  if (status === 504) return E.timeout;
  if (status === 400 && data && data.message) return data.message;
  return E.generic;
}

async function askBot(question) {
  showThinking();
  setStatus('THINKING…', 'busy');
  setCharState('thinking');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question.slice(0, CHAT_MAX_CHARS), lang: currentLang }),
      signal: ctrl.signal,
    });
    let data = {};
    try { data = await res.json(); } catch (_) { /* non-JSON error page */ }
    if (!res.ok || data.error) {
      showAnswer(friendlyChatError(res.status, data), 0, false);
      setCharState('idle');
      return;
    }
    showAnswer(data.answer, data.confidence);
    if (data.found !== false) {
      const room = data.room_id && roomById(data.room_id);
      if (room) routeTo(room);
      else autoOpenMapIfNeeded(data.answer, question);
    }
    else clearRoute();
    await playResponse(data);
  } catch (err) {
    console.error('[Chat] error:', err);
    const E = CHAT_ERRORS[currentLang] || CHAT_ERRORS.IND;
    showAnswer(err.name === 'AbortError' ? E.timeout : E.network, 0, false);
    setCharState('idle');
  } finally {
    clearTimeout(timer);
    setStatus('READY');
  }
}

/* After a chatbot answer: if the question or answer names a room, route to it.
   The longest matching name/alias wins ("library lantai 2" beats "library"),
   whole words only, question first. */
function autoOpenMapIfNeeded(answer, question = '') {
  try {
    const findIn = text => {
      const hay = ' ' + String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ') + ' ';
      let best = null, bestLen = 0;
      for (const r of ROOMS) {
        for (const key of [r.id, r.name, ...(r.aliases || [])]) {
          const k = String(key).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
          if (k.length >= 3 && k.length > bestLen && hay.includes(' ' + k + ' ')) { best = r; bestLen = k.length; }
        }
      }
      return best;
    };
    const matched = findIn(question) || findIn(answer);
    if (matched) routeTo(matched);
  } catch (e) { console.warn('[Map] route error:', e); }
}

function showRouteQR() {
  if (!lastDirectionsText) return;
  const modal = document.getElementById('qr-modal');
  const img   = document.getElementById('qr-img');
  const cap   = document.getElementById('qr-caption');
  img.src = '/qr?text=' + encodeURIComponent(lastDirectionsText);
  cap.textContent = 'Scan untuk membawa petunjuk arah ke HP Anda';
  modal.classList.add('show');
}
function hideRouteQR() {
  document.getElementById('qr-modal').classList.remove('show');
}

async function playResponse(data) {
  if (quietMode) {
    setCharState('idle');
    return;
  }
  micRing.classList.add('active');
  setStatus('SPEAKING…', 'busy');
  setCharState('speak');

  try {
    let url;
    if (data.has_audio_file && data.audio_id != null) {
      url = `/audio/${data.audio_id}`;
    } else {
      const langCode = LANG_TO_CODE[currentLang] || 'id';
      const r = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: data.answer, lang: langCode }),
      });
      if (!r.ok) throw new Error('TTS failed');
      url = URL.createObjectURL(await r.blob());
    }
    await playAudioUrl(url);
  } catch (err) {
    console.warn('Playback error:', err);
  } finally {
    micRing.classList.remove('active');
    setCharState('idle');
  }
}

let currentAudio = null;
function playAudioUrl(url) {
  if (currentAudio) { currentAudio.pause(); currentAudio.onended && currentAudio.onended(); }
  return new Promise(resolve => {
    const a = new Audio(url);
    currentAudio = a;
    const done = () => { if (currentAudio === a) currentAudio = null; resolve(); };
    a.onended = done;
    a.onerror = done;
    a.play().catch(done);
  });
}

function toggleQuiet() {
  quietMode = !quietMode;
  const btn = document.getElementById('btn-quiet');
  if (btn) btn.classList.toggle('active', quietMode);
}

const FEEDBACK_TEXT = {
  IND: { thanks: 'Terima kasih!', more: 'Ceritakan lebih lanjut →' },
  ENG: { thanks: 'Thanks!',       more: 'Tell us more →' },
  ZH:  { thanks: '谢谢！',          more: '告诉我们更多 →' },
};

async function sendFeedback(positive, el) {
  // Swap the buttons for a thank-you, with a link to the full feedback form
  const row = el && el.closest('.feedback-row');
  if (row) {
    const t = FEEDBACK_TEXT[currentLang] || FEEDBACK_TEXT.IND;
    const category = positive ? 'Compliment' : 'Bug';
    row.innerHTML =
      `<span class="fb-thanks">${t.thanks}</span>
       <a class="fb-more" href="/feedback?from=chat&category=${category}">${t.more}</a>`;
  }
  try {
    await fetch('/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ positive, question: userQ.textContent }),
    });
  } catch(e) {}
}

fetch('/status').then(r => r.json()).then(d => {
  const pill = document.getElementById('ip-pill');
  const txt  = document.getElementById('ip-text');
  if (d.ip) {
    txt.textContent = `${d.ip}:${d.port}`;
    pill.style.display = 'flex';
  }
}).catch(() => {});

/* ── Event wiring ─────────────────────────────────────────────────────────
   Buttons carry data-action="…" instead of inline onclick= attributes, which
   the Content-Security-Policy blocks. One delegated listener handles them all,
   including buttons created later with innerHTML. */
const ACTIONS = {
  resetAll:     () => resetAll(),
  submitSearch: () => submitSearch(),
  toggleMap:    () => toggleMap(),
  toggleQuiet:  () => toggleQuiet(),
  setLang:      el => setLang(el),
  wave:         () => setCharState('waving', 2000),
  showRouteQR:  () => showRouteQR(),
  hideRouteQR:  () => hideRouteQR(),
  showLeg:      el => showLeg(el),
  pickRoom:     el => pickRoom(roomById(el.dataset.id)),
  feedbackYes:  el => sendFeedback(true, el),
  feedbackNo:   el => sendFeedback(false, el),
  ask:          el => askSuggestion(el.dataset.q),
};
document.addEventListener('click', e => {
  if (e.target.id === 'qr-modal') { hideRouteQR(); return; }   // click on the backdrop
  if (!e.target.closest('.search-wrap')) closeSearchResults();
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);
});
searchInput.addEventListener('keydown', e => handleSearchKey(e));
searchInput.addEventListener('input', () => { searchIndex = -1; renderSearchResults(); });
searchInput.addEventListener('focus', () => { if (searchInput.value.trim()) renderSearchResults(); });
micBtn.addEventListener('mousedown',  () => startRecording());
micBtn.addEventListener('mouseup',    () => stopRecording());
micBtn.addEventListener('touchstart', () => startRecording());
micBtn.addEventListener('touchend',   () => stopRecording());
</script>

    <h3>Bawa Arah ke HP</h3>
    <img id="qr-img" alt="QR petunjuk arah">
    <div class="qr-caption" id="qr-caption"></div>
    <button class="qr-close" data-action="hideRouteQR">Tutup</button>
  </div>
</div>
