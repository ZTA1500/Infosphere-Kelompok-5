<header class="deck on-band admin-deck">
  <a class="brand" href="{{ admin_base() }}" aria-label="Infosphere admin">
    <img src="/static/brand/logo-icon.png" alt="" width="29" height="34">
    <span class="brand-word">info<b>sphere</b></span>
    <span class="brand-tag">ADMIN</span>
  </a>
  <nav class="admin-nav" aria-label="Admin">
    <a href="{{ admin_base() }}" {% if active == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
    <a href="{{ admin_base() }}/feedback" {% if active == 'feedback' %}aria-current="page"{% endif %}>
      Feedback<span class="nav-count" data-unread-badge hidden></span>
    </a>
    <a href="{{ admin_base() }}/area-status" {% if active == 'area-status' %}aria-current="page"{% endif %}>Area status</a>
    <a href="/" target="_blank" rel="noopener">Kiosk</a>
  </nav>
  <div class="header-right">
    {% if active == 'dashboard' %}
    <span id="refresh-dot" title="Refreshes every 30 seconds" aria-hidden="true"></span>
    <button class="btn-action outline" type="button" id="btn-refresh" title="Refresh now">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span class="btn-label">Refresh</span>
    </button>
    <button class="btn-action outline" type="button" id="btn-export" title="Export questions as CSV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="btn-label">Export CSV</span>
    </button>
    <button class="btn-action" type="button" id="btn-retrain" title="Retrain the chatbot model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.5-.8z"/></svg><span class="btn-label">Retrain</span>
    </button>
    {% endif %}
    <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <defs><mask id="tt-mask"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="tt-shade" cx="12" cy="12" r="8" fill="#000"/></mask></defs>
        <circle class="tt-disc" cx="12" cy="12" r="5" fill="currentColor" mask="url(#tt-mask)"/>
        <g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></g>
      </svg>
    </button>
    <form class="logout-form" method="post" action="{{ admin_base() }}/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn-action outline" type="submit">Log out</button>
    </form>
  </div>
</header>
